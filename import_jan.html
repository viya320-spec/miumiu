function findSheet(){
  var q=encodeURIComponent("name='客戶關懷系統' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
  fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)',{headers:{Authorization:'Bearer '+gToken}})
  .then(function(r){return r.json();})
  .then(function(res){
    if(!res.files||!res.files.length){setStatus('找不到試算表！請先登入客戶關懷系統','er');document.getElementById('btn').disabled=false;return;}
    gSheetId=res.files[0].id;
    setStatus('讀取現有資料…');
    doImport();
  });
}

function doImport(){
  var prog=document.getElementById('prog');var bar=document.getElementById('bar');
  prog.style.display='block';
  fetch('https://sheets.googleapis.com/v4/spreadsheets/'+gSheetId+'/values/'+encodeURIComponent(SHEET_TITLE+'!A2:G'),{headers:{Authorization:'Bearer '+gToken}})
  .then(function(r){return r.json();})
  .then(function(existing){
    var rows=existing.values||[];
    var clients=[];
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      var recs=[];try{recs=JSON.parse(r[4]||'[]');}catch(e){recs=[];}
      if(r[0])clients.push({id:r[0],name:r[1]||'',birthday:r[2]||'',tags:r[3]?r[3].split(',').filter(Boolean):[],records:recs,createdAt:r[5]||'',code:r[6]||''});
    }
    var total=DATA.length,processed=0;
    function next(){
      if(processed>=total){writeSheet(clients);return;}
      var d=DATA[processed];
      bar.style.width=Math.round((processed+1)/total*100)+'%';
      setStatus('處理 '+(processed+1)+'/'+total+'：'+d.name);
      var found=null;
      for(var j=0;j<clients.length;j++){if(clients[j].name===d.name){found=clients[j];break;}}
      var newRecs=[];
      for(var k=0;k<d.records.length;k++){
        newRecs.push({id:Date.now().toString()+'_'+processed+'_'+k,date:d.records[k].visit_date,procedure:'',note:d.records[k].note});
      }
      if(found){
        found.records=(found.records||[]).concat(newRecs);
        found.records.sort(function(a,b){return b.date.localeCompare(a.date);});
        if(!found.birthday&&d.birthday)found.birthday=d.birthday;
      }else{
        clients.push({id:Date.now().toString()+'_'+processed,name:d.name,birthday:d.birthday||'',tags:[],records:newRecs,createdAt:new Date().toISOString(),code:''});
      }
      processed++;setTimeout(next,20);
    }
    next();
  });
}

function writeSheet(clients){
  setStatus('寫入 Google Sheets…');
  var values=[['ID','姓名','生日','標籤','紀錄JSON','建立時間','編號']];
  for(var i=0;i<clients.length;i++){
    var c=clients[i];
    values.push([c.id,c.name,c.birthday||'',c.tags.join(','),JSON.stringify(c.records||[]),c.createdAt||'',c.code||'']);
  }
  fetch('https://sheets.googleapis.com/v4/spreadsheets/'+gSheetId+'/values/'+encodeURIComponent(SHEET_TITLE+'!A1')+'?valueInputOption=RAW',{
    method:'PUT',headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},
    body:JSON.stringify({values:values})
  }).then(function(){
    document.getElementById('bar').style.width='100%';
    setStatus('✓ 匯入完成！共 '+clients.length+' 位客戶。請回到客戶關懷系統重新整理查看。','ok');
  }).catch(function(){setStatus('寫入失敗，請重試','er');document.getElementById('btn').disabled=false;});
}
</script>
