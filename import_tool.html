<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>資料匯入工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#f8f5ff;padding:20px;font-size:15px;}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(130,80,180,.1);}
h1{font-size:20px;font-weight:700;color:#3a3530;margin-bottom:6px;}
.sub{font-size:13px;color:#7a6e65;margin-bottom:20px;}
.client-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0ece4;}
.client-row:last-child{border-bottom:none;}
.name{font-size:16px;font-weight:600;color:#3a3530;width:70px;flex-shrink:0;}
.bday{font-size:13px;color:#7a6e65;width:100px;flex-shrink:0;}
.note-p{font-size:12px;color:#b0a89e;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.date{font-size:12px;color:#8a7d9e;width:90px;flex-shrink:0;text-align:right;}
.btn{display:block;width:100%;padding:16px;font-size:17px;font-weight:700;border:none;border-radius:14px;background:linear-gradient(135deg,#b8927a,#8a7d9e);color:#fff;cursor:pointer;margin-top:20px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.status{margin-top:14px;font-size:14px;color:#7a6e65;text-align:center;min-height:20px;}
.progress{width:100%;height:8px;background:#f0ece4;border-radius:10px;margin-top:10px;overflow:hidden;display:none;}
.progress-bar{height:100%;background:linear-gradient(135deg,#b8927a,#8a7d9e);border-radius:10px;transition:width .3s;width:0%;}
.success{color:#5a8a6a;font-weight:600;}
.err{color:#cc4444;}
.info{background:#fdf5ee;border:1px solid #e8d8c8;border-radius:12px;padding:14px;margin-bottom:16px;font-size:13px;color:#7a5a40;line-height:1.6;}
</style>
</head>
<body>
<div class="card">
  <h1>📋 客戶資料匯入工具</h1>
  <div class="sub">共 16 筆資料，準備匯入您的客戶關懷系統</div>
  
  <div class="info">
    ⚠️ 請先在<strong>客戶關懷系統</strong>登入您的 Google 帳號，再回來這裡按匯入。<br>
    兩個視窗要用<strong>同一個瀏覽器</strong>開啟。
  </div>

  <div id="clientList"></div>
  
  <button class="btn" id="importBtn" onclick="startImport()">開始匯入 16 筆資料</button>
  <div class="progress" id="prog"><div class="progress-bar" id="progBar"></div></div>
  <div class="status" id="status"></div>
</div>

<script>
var IMPORT_DATA = [{"name": "林玫君", "birthday": "1976-11-04", "visit_date": "2026-05-06", "note": "不想侵入，也先不想電音波，想先清潔，年輕皮膚油，現在乾，兒子大一，有凹痘疤，之前皮膚科做過微針，覺得超痛，想帶兒子來做海菲秀wishpro, 再決定要買套組嗎，有問皮蜂套組，告知母親節"}, {"name": "徐淑惠", "birthday": "1982-04-09", "visit_date": "2026-05-06", "note": "去年12月有打美國音波第一代的，這是第二次，覺得第一次效果很好，這次效果沒有很好，打了800條，平常打猛健樂的診所，建議下次打10毫克，現在是打五，有建議不要跳這麼快，今天買音波700條，加上猛健樂7.5毫克，打音波想要的效果是法令比較淡，皮膚有拉提效果"}, {"name": "陳芃聿", "birthday": "1999-04-18", "visit_date": "2026-05-06", "note": "大學眼科驗光師，朋友有在這邊做全身除毛，先買私密處終身還有腋下兩年卡，建議小腿可以做兩年卡"}, {"name": "吳宜謙", "birthday": "1997-07-30", "visit_date": "2026-05-07", "note": "都沒做過醫美，5/8拍婚紗，十月份結婚"}, {"name": "李姿蓉", "birthday": "1997-03-13", "visit_date": "2026-05-07", "note": "沒做過醫美，臉上有痘痘都會自己摳，有買海飛秀跟wish體驗，下次做"}, {"name": "曾懷恩", "birthday": "2002-02-23", "visit_date": "2026-05-08", "note": "不想打猛健樂，體脂肪跟內臟脂肪超高，買10+3，建議不要喝火鍋的湯不要喝有糖的飲料，下半身的肌肉量比較缺乏"}, {"name": "吳雨儒", "birthday": "1984-01-21", "visit_date": "2026-05-09", "note": "五年前打過電波覺得超痛，兩年前打過皮秒覺得沒什麼感覺，肌膚檢測皮膚敏感度六十多%，兩頰容易紅，深班比較多，建議膚質先提升養好，買PLT套組"}, {"name": "郭舒茵", "birthday": "1970-03-01", "visit_date": "2026-05-09", "note": "張珺珽的媽媽，都沒有做過醫美，只有打過動態肉毒兩個月前，下巴還會長痘痘皮膚比較乾。醫生建議補水針4cc加肉毒20u,海菲秀，心動光退紅，皮秒蜂巢，以女兒為榮，覺得女兒很厲害，而且薪水很高"}, {"name": "李奕昕", "birthday": "2006-02-13", "visit_date": "2026-05-09", "note": "林玫君大兒子，有在皮膚科有做過微針筆，覺得超痛，有凹洞疤，皮膚兩頰是敏感的，額頭會長痘痘，之前吃過A酸治療，已經比較好了，現在大學一年級，前期先海菲秀治療皮膚，之後再用喬雅露改善凹洞，目前用資生堂的保養品"}, {"name": "林子瑜", "birthday": "1996-01-03", "visit_date": "2026-05-09", "note": "5/11要拍婚紗，年底要結婚，都沒有做過除毛，今天先買腋下除毛，也有體驗小腿除毛，但先不購買兩年卡，先體驗就好"}, {"name": "范微微", "birthday": "2000-01-11", "visit_date": "2026-05-10", "note": "很有預算，考量皮膚超敏感又有過敏的建議心動光跟PLT，要回去跟男朋友討論，embody先買13堂，想改善額頭的凹疤痕，建議vibella1cc,18000，加肉毒抬頭12u,皺眉12U，再想想，很有預算考量"}, {"name": "張世怡", "birthday": "2002-03-29", "visit_date": "2026-05-11", "note": "張采薇朋友，醇之前打過唇，後來都消了，沒想要太澎，只是想要微笑唇"}, {"name": "王渝媗", "birthday": "1981-01-17", "visit_date": "2026-05-11", "note": "很多年前打過皮秒斑比較淡，後來半夜變生了，建議之後改善好還是要保養打皮秒，也在意淚溝法令紋，但是預算非常有限，接下來還要出國玩，今天先買蜂5000發"}, {"name": "王雅君", "birthday": "1989-07-16", "visit_date": "2026-05-11", "note": "都沒打過猛健樂，也沒做過醫美，體脂肪超高，內臟脂肪超高，先買猛跟燃脂點滴體驗"}, {"name": "林秀雀", "birthday": "1965-09-12", "visit_date": "2026-05-13", "note": "大女兒是老師36歲，小女兒長期住在新加坡，飯店工作七八年沒有回來看媽媽，小兒子20多歲在當兵中，20年前老公就過世了，從沒有做過醫美，都沒有拿小孩的錢，在意淚溝，先改善完再來處理斑"}, {"name": "陳奕綸", "birthday": "1997-12-14", "visit_date": "2026-05-15", "note": "之前是聖宜護士和兩位朋友一起來，女兒兩個月大，有想要問鳳凰電波，但是要比較一下價錢，音波建議600條，今天先買肉毒三瓶，私密處除毛兩年卡"}];
var CLIENT_ID = '543207730758-9ts36ee65ientbnj0oldfp2qk7k1uc0r.apps.googleusercontent.com';
var SHEET_TITLE = 'Miu客戶關懷';
var accessToken = null;
var sheetId = null;

// Show preview
var list = document.getElementById('clientList');
list.innerHTML = IMPORT_DATA.map(function(c) {
  return '<div class="client-row">' +
    '<span class="name">' + c.name + '</span>' +
    '<span class="bday">' + c.birthday + '</span>' +
    '<span class="note-p">' + c.note.slice(0,30) + '…</span>' +
    '<span class="date">' + c.visit_date + '</span>' +
    '</div>';
}).join('');

function setStatus(msg, cls) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls||'');
}

async function startImport() {
  document.getElementById('importBtn').disabled = true;
  setStatus('正在登入 Google…');
  
  google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.readonly email',
    callback: async function(resp) {
      if (resp.error) { setStatus('登入失敗：' + resp.error, 'err'); return; }
      accessToken = resp.access_token;
      setStatus('登入成功，搜尋您的試算表…');
      await findSheet();
    }
  }).requestAccessToken();
}

async function findSheet() {
  // Search for the sheet
  var q = encodeURIComponent("name='客戶關懷系統' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
  var res = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)', {
    headers: { Authorization: 'Bearer ' + accessToken }
  }).then(function(r) { return r.json(); });
  
  if (!res.files || res.files.length === 0) {
    setStatus('找不到試算表！請先在客戶關懷系統登入一次。', 'err');
    document.getElementById('importBtn').disabled = false;
    return;
  }
  sheetId = res.files[0].id;
  setStatus('找到試算表，開始匯入…');
  await doImport();
}

async function doImport() {
  var prog = document.getElementById('prog');
  var bar = document.getElementById('progBar');
  prog.style.display = 'block';
  
  // Load existing data first
  var existing = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + sheetId + '/values/' + encodeURIComponent(SHEET_TITLE + '!A2:G'), {
    headers: { Authorization: 'Bearer ' + accessToken }
  }).then(function(r) { return r.json(); });
  
  var rows = existing.values || [];
  var clients = rows.map(function(r) {
    return {
      id: r[0]||'', name: r[1]||'', birthday: r[2]||'',
      tags: r[3] ? r[3].split(',').filter(Boolean) : [],
      records: r[4] ? (function(){ try{ return JSON.parse(r[4]); }catch(e){ return []; } })() : [],
      createdAt: r[5]||'', code: r[6]||''
    };
  }).filter(function(c) { return c.id; });
  
  var total = IMPORT_DATA.length;
  
  for (var i = 0; i < total; i++) {
    var d = IMPORT_DATA[i];
    bar.style.width = Math.round((i+1)/total*100) + '%';
    setStatus('匯入中 ' + (i+1) + '/' + total + '：' + d.name);
    
    // Find existing client with same name
    var existing_client = null;
    for (var j = 0; j < clients.length; j++) {
      if (clients[j].name === d.name) { existing_client = clients[j]; break; }
    }
    
    var record = {
      id: Date.now().toString() + i,
      date: d.visit_date,
      procedure: '',
      note: d.note
    };
    
    if (existing_client) {
      // Add record to existing client
      existing_client.records = existing_client.records || [];
      existing_client.records.unshift(record);
    } else {
      // Create new client
      clients.push({
        id: Date.now().toString() + '_' + i,
        name: d.name,
        birthday: d.birthday,
        tags: [],
        records: [record],
        createdAt: new Date().toISOString(),
        code: ''
      });
    }
    
    await new Promise(function(r) { setTimeout(r, 50); });
  }
  
  // Write all back to sheet
  setStatus('儲存到 Google Sheets…');
  var values = [['ID','姓名','生日','標籤','紀錄JSON','建立時間','編號']].concat(
    clients.map(function(c) {
      return [c.id, c.name, c.birthday||'', c.tags.join(','), JSON.stringify(c.records||[]), c.createdAt||'', c.code||''];
    })
  );
  
  await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + sheetId + '/values/' + encodeURIComponent(SHEET_TITLE + '!A1') + '?valueInputOption=RAW', {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: values })
  });
  
  bar.style.width = '100%';
  setStatus('✓ 匯入完成！共 ' + clients.length + ' 位客戶，請回到客戶關懷系統重新整理查看。', 'success');
}
</script>
<script src="https://accounts.google.com/gsi/client" async></script>
</body>
</html>
