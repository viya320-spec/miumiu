var CLIENT_ID = '543207730758-9ts36ee65ientbnj0oldfp2qk7k1uc0r.apps.googleusercontent.com';
var SHEET_TITLE = 'Miu客戶關懷';
var token = null, sheetId = null;

var list = document.getElementById('clientList');
list.innerHTML = DATA.map(function(c,i){
  return '<div class="client-row"><span class="idx">'+(i+1)+'</span><span class="cname">'+c.name+'</span><span class="cbday">'+(c.birthday||'未填生日')+'</span><span class="cnote">'+(c.records[0]?c.records[0].note.slice(0,25)+'…':'')+'</span></div>';
}).join('');

function setStatus(msg,cls){var el=document.getElementById('status');el.textContent=msg;el.className='status '+(cls||'');}

async function startImport(){
  document.getElementById('importBtn').disabled=true;
  setStatus('登入 Google 中…');
  google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.readonly email',
    callback:async function(resp){
      if(resp.error){setStatus('登入失敗','er');return;}
      token=resp.access_token;
      setStatus('搜尋您的試算表…');
      await findSheet();
    }
  }).requestAccessToken();
}

async function findSheet(){
  var q=encodeURIComponent("name='客戶關懷系統' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
  var res=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)',{headers:{Authorization:'Bearer '+token}}).then(function(r){return r.json();});
  if(!res.files||!res.files.length){setStatus('找不到試算表！請先登入客戶關懷系統一次','er');document.getElementById('importBtn').disabled=false;return;}
  sheetId=res.files[0].id;
  setStatus('找到試算表，讀取現有資料…');
  await doImport();
}

async function doImport(){
  var prog=document.getElementById('prog');var bar=document.getElementById('bar');
  prog.style.display='block';
  var existing=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(SHEET_TITLE+'!A2:G'),{headers:{Authorization:'Bearer '+token}}).then(function(r){return r.json();});
  var rows=existing.values||[];
  var clients=rows.map(function(r){return{id:r[0]||'',name:r[1]||'',birthday:r[2]||'',tags:r[3]?r[3].split(',').filter(Boolean):[],records:r[4]?(function(){try{return JSON.parse(r[4]);}catch(e){return[];}})()':[],createdAt:r[5]||'',code:r[6]||''}}).filter(function(c){return c.id;});
  
  for(var i=0;i<DATA.length;i++){
    var d=DATA[i];
    bar.style.width=Math.round((i+1)/DATA.length*100)+'%';
    setStatus('處理 '+(i+1)+'/'+DATA.length+'：'+d.name);
    var found=null;
    for(var j=0;j<clients.length;j++){if(clients[j].name===d.name){found=clients[j];break;}}
    var recs=d.records.map(function(r,ri){return{id:Date.now().toString()+'_'+i+'_'+ri,date:r.visit_date,procedure:'',note:r.note}});
    if(found){
      found.records=(found.records||[]).concat(recs);
      found.records.sort(function(a,b){return b.date.localeCompare(a.date);});
      if(!found.birthday&&d.birthday)found.birthday=d.birthday;
    }else{
      clients.push({id:Date.now().toString()+'_'+i,name:d.name,birthday:d.birthday,tags:[],records:recs,createdAt:new Date().toISOString(),code:''});
    }
    await new Promise(function(r){setTimeout(r,30);});
  }
  
  setStatus('寫入 Google Sheets…');
  var values=[['ID','姓名','生日','標籤','紀錄JSON','建立時間','編號']].concat(clients.map(function(c){return[c.id,c.name,c.birthday||'',c.tags.join(''),JSON.stringify(c.records||[]),c.createdAt||'',c.code||''];}));
  await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(SHEET_TITLE+'!A1')+'?valueInputOption=RAW',{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({values:values})});
  bar.style.width='100%';
  setStatus('✓ 匯入完成！共 '+clients.length+' 位客戶。請回到客戶關懷系統重新整理查看。','ok');
}
