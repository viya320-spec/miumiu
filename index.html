<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Miu客戶關懷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --g1:#f87ab2;--g2:#a96cdc;--g3:#6b8fe8;--g4:#f0a070;
  --mint:#00c9a7;--mint-d:#00906f;
  --coral:#f87ab2;--violet:#a96cdc;--blue:#6b8fe8;
  --bg:#f8f5ff;--card:#ffffff;
  --text1:#1a1028;--text2:#6b5a88;--text3:#a89cc0;
  --sep:rgba(120,80,180,.07);
  --r:16px;--r-lg:22px;--r-xl:28px;
  --shadow:0 6px 24px rgba(130,80,180,.13);
  --shadow-sm:0 3px 12px rgba(130,80,180,.09);
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text1);font-size:17px;line-height:1.6;min-height:100vh;}

/* ── Login ── */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 28px;gap:22px;background:linear-gradient(145deg,#ff6b9d22 0%,#c44dff22 50%,#4d79ff22 100%);}
.login-blob{width:90px;height:90px;border-radius:30px;background:linear-gradient(135deg,#e8709e,#9055c8);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 30px rgba(52,199,154,.25);}
.login-title{font-size:24px;font-weight:800;background:linear-gradient(135deg,#e05590,#9055c8,#5572d8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.login-sub{font-size:14px;color:var(--text2);text-align:center;line-height:1.7;}
.btn-google{display:flex;align-items:center;gap:12px;padding:16px 24px;font-size:16px;font-weight:600;border:none;border-radius:var(--r-lg);background:#fff;color:var(--text1);cursor:pointer;width:100%;justify-content:center;box-shadow:var(--shadow);}
.btn-google svg{width:22px;height:22px;flex-shrink:0;}

/* ── App shell ── */
.app{min-height:100vh;padding-bottom:90px;}

/* ── Header ── */
.header{padding:16px 20px 14px;background:linear-gradient(135deg,#e8709e 0%,#9e68d4 60%,#6278cc 100%);position:sticky;top:0;z-index:10;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.header-title{font-size:22px;font-weight:800;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.15);}
.header-sub{font-size:12px;color:rgba(255,255,255,.8);margin-top:1px;}
.btn-new{display:flex;align-items:center;gap:5px;padding:10px 18px;font-size:16px;font-weight:700;border:none;border-radius:30px;background:rgba(255,255,255,.25);color:#fff;cursor:pointer;border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(0,0,0,.15);}
.search-bar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border-radius:14px;padding:10px 14px;box-shadow:0 2px 12px rgba(0,0,0,.12);}
.search-bar i{font-size:17px;color:var(--text3);}
.search-bar input{flex:1;border:none;background:transparent;font-size:17px;color:var(--text1);outline:none;}
.search-bar input::placeholder{color:var(--text3);}

/* ── Status ── */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:7px 20px;background:linear-gradient(135deg,#fdf0f7,#f2ecff);}
.s-user{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;overflow:hidden;}
.s-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;}
.s-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sync-dot{font-size:12px;color:#8850c8;font-weight:500;display:flex;align-items:center;gap:3px;}
.sync-dot.syncing{color:#ff9500;}
.sync-dot.err{color:#ff3b30;}
.btn-out{font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.05);}

/* ── Chips ── */
.chips{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;background:transparent;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:8px 18px;border-radius:30px;font-size:15px;font-weight:600;border:none;background:#fff;color:var(--text2);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-sm);flex-shrink:0;}
.chip.active{color:#fff;box-shadow:0 4px 14px rgba(180,80,220,.35);}

/* ── List ── */
.list{padding:4px 16px 0;display:flex;flex-direction:column;gap:10px;}
.client-card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:transform .12s;}
.client-card:active{transform:scale(.97);}
.card-accent{height:4px;width:100%;}
.card-body{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;}
.card-info{flex:1;min-width:0;}
.card-name{font-size:18px;font-weight:700;color:var(--text1);margin-bottom:3px;}
.card-bday{font-size:14px;color:var(--text2);margin-bottom:4px;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;}
.card-tag-pill{font-size:13px;font-weight:600;padding:2px 9px;border-radius:20px;}
.card-chevron{color:var(--text3);font-size:16px;flex-shrink:0;}
.card-last{font-size:12px;color:var(--text3);padding:0 16px 12px 74px;display:flex;align-items:center;gap:4px;}
.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty i{font-size:52px;display:block;margin-bottom:14px;}
.empty-t{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.empty-s{font-size:13px;}

/* ── Panel ── */
.panel{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:90px;}
.panel.open{transform:translateX(0);}
.panel-header{padding:14px 20px;background:linear-gradient(135deg,#e8709e 0%,#9e68d4 60%,#6278cc 100%);position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;}
.btn-back{display:flex;align-items:center;gap:2px;font-size:15px;color:#fff;background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.5);border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:600;backdrop-filter:blur(10px);}
.panel-htitle{flex:1;text-align:center;font-size:19px;font-weight:700;color:#fff;}
.btn-done{font-size:15px;font-weight:700;color:#c0508a;background:rgba(255,255,255,.92);border:none;border-radius:20px;padding:7px 16px;cursor:pointer;font-weight:800;}

/* ── Form cards ── */
.form-card{background:#fff;border-radius:var(--r-lg);margin:14px 16px 0;box-shadow:var(--shadow-sm);overflow:hidden;}
.form-card-title{font-size:12px;font-weight:700;color:var(--text3);padding:14px 16px 6px;letter-spacing:.5px;text-transform:uppercase;}
.frow{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--sep);min-height:50px;}
.frow:last-child{border-bottom:none;}
.flabel{font-size:17px;font-weight:600;color:var(--text1);width:72px;flex-shrink:0;}
.finput{flex:1;padding:13px 0;font-size:17px;border:none;background:transparent;color:var(--text1);outline:none;text-align:right;}
.finput::placeholder{color:var(--text3);}

/* ── Tags ── */
.tags-area{padding:12px 16px 16px;display:flex;flex-wrap:wrap;gap:8px;}
.tag-pill{padding:8px 18px;border-radius:30px;font-size:16px;font-weight:600;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px;background:#f4f6fb;color:var(--text2);}
.tag-pill.on{color:#fff;}
.tag-pill .tdel{font-size:14px;opacity:.6;}
.btn-newtag{padding:7px 16px;border-radius:30px;font-size:14px;font-weight:600;border:2px dashed var(--text3);background:transparent;color:var(--mint-d);cursor:pointer;display:flex;align-items:center;gap:5px;}

/* ── Records ── */
.rec-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;}
.rec-hdr-t{font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;}
.btn-addrec{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:#9055c8;background:rgba(144,85,200,.10);border:none;border-radius:20px;padding:6px 14px;cursor:pointer;}
.rec-card{border-radius:var(--r-lg);margin:0 16px 18px;box-shadow:0 4px 18px rgba(100,100,160,.13);overflow:hidden;border:2px solid rgba(255,255,255,.9);}
.rec-card:nth-child(1){background:linear-gradient(160deg,#fce8f4,#ede4ff);}
.rec-card:nth-child(2){background:linear-gradient(160deg,#e4eeff,#fce8f4);}
.rec-card:nth-child(3){background:linear-gradient(160deg,#fff4e0,#e2f8ee);}
.rec-card:nth-child(4){background:linear-gradient(160deg,#ede4ff,#e4eeff);}
.rec-card:nth-child(n+5){background:linear-gradient(160deg,#fce8f4,#ede4ff);}
.rec-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.35);}
.rec-date{font-size:17px;font-weight:800;color:#8850c8;border:none;background:transparent;outline:none;letter-spacing:.3px;}
.btn-recdel{background:none;border:none;color:#ff3b30;font-size:20px;cursor:pointer;}
.rec-field{padding:0 14px;border-bottom:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.45);}
.note-wrap{position:relative;}
.note-preview{font-size:16px;color:var(--text1);padding:8px 0 10px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.note-full{font-size:16px;color:var(--text1);padding:8px 0 10px;line-height:1.6;display:none;white-space:pre-wrap;word-break:break-all;}
.note-textarea{width:100%;font-size:16px;border:none;background:transparent;color:var(--text1);outline:none;resize:none;line-height:1.6;padding:8px 0 10px;min-height:80px;}
.note-textarea::placeholder{color:var(--text3);}
.btn-expand{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:#9055c8;background:rgba(144,85,200,.1);border:none;border-radius:20px;padding:4px 12px;cursor:pointer;margin-bottom:10px;}
.note-modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;}
.note-modal-bg.open{display:flex;}
.note-modal{background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 48px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:12px;}
.note-modal-header{display:flex;align-items:center;justify-content:space-between;}
.note-modal-title{font-size:17px;font-weight:700;color:var(--text1);}
.btn-note-close{font-size:15px;font-weight:600;color:#9055c8;background:none;border:none;cursor:pointer;padding:4px 8px;}
.note-modal-content{font-size:17px;color:var(--text1);line-height:1.8;overflow-y:auto;flex:1;white-space:pre-wrap;word-break:break-all;padding:4px 0;}
.rec-field:last-child{border-bottom:none;border-radius:0 0 var(--r-lg) var(--r-lg);}
.rec-flabel{font-size:11px;font-weight:700;color:var(--text3);padding-top:10px;letter-spacing:.4px;text-transform:uppercase;}
.rec-field input,.rec-field textarea{width:100%;font-size:17px;border:none;background:transparent;color:var(--text1);outline:none;padding:6px 0 10px;resize:none;line-height:1.5;}
.rec-field input::placeholder,.rec-field textarea::placeholder{color:var(--text3);}
.no-rec{text-align:center;padding:24px;color:var(--text3);font-size:14px;}

/* ── Delete ── */
.btn-del-client{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 16px 0;width:calc(100%-32px);padding:15px;font-size:16px;font-weight:600;color:#ff3b30;background:#fff;border:none;border-radius:var(--r-lg);cursor:pointer;box-shadow:var(--shadow-sm);width:calc(100% - 32px);}

/* ── Modals ── */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:flex-end;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:24px 20px 48px;width:100%;display:flex;flex-direction:column;gap:16px;}
.modal-handle{width:36px;height:4px;background:var(--text3);border-radius:4px;margin:0 auto 4px;}
.modal-title{font-size:18px;font-weight:800;color:var(--text1);}
.minput{padding:14px 16px;font-size:18px;border:1.5px solid #eee;border-radius:var(--r);background:#f9f9f9;color:var(--text1);width:100%;outline:none;}
.minput:focus{border-color:var(--mint);}
.mactions{display:flex;gap:10px;}
.btn-mcancel{flex:1;padding:14px;font-size:18px;border:1.5px solid #eee;border-radius:var(--r-lg);background:#fff;color:var(--text2);cursor:pointer;font-weight:600;}
.btn-mok{flex:1;padding:14px;font-size:18px;font-weight:700;border:none;border-radius:var(--r-lg);background:linear-gradient(135deg,#e8709e,#9055c8);color:#fff;cursor:pointer;}
.color-row{display:flex;gap:10px;flex-wrap:wrap;}
.cdot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s;}
.cdot.on{border-color:var(--text1);transform:scale(1.15);}

/* ── Toast ── */
.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(30,30,40,.85);color:#fff;padding:11px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:60;transition:transform .28s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(10px);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:rgba(26,158,117,.9);}
.toast.err{background:rgba(255,59,48,.9);}
.spinning{display:inline-block;animation:spin .8s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Loading -->
<div id="loadingScreen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(145deg,#fce8f3 0%,#ede8ff 50%,#e8eeff 100%);gap:16px;">
  <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#f87ab2,#a96cdc);display:flex;align-items:center;justify-content:center;font-size:36px;">🌿</div>
  <div style="font-size:18px;font-weight:700;color:#2d2d3a;">Miu 客戶關懷</div>
  <div style="font-size:14px;color:#6b6b80;">載入中…</div>
</div>

<!-- Login -->
<div id="loginScreen" class="login" style="display:none;">
  <div class="login-blob">🌿</div>
  <div>
    <div class="login-title">Miu 客戶關懷</div>
    <div style="font-size:13px;color:var(--text2);text-align:center;margin-top:6px;">您的專屬診所客戶管理系統</div>
  </div>
  <div class="login-sub">登入 Google 帳號，資料自動同步<br>安全儲存於您的 Google Sheets</div>
  <button class="btn-google" onclick="signIn()">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    使用 Google 帳號登入
  </button>
</div>

<!-- Main App -->
<div id="mainApp" style="display:none;">
  <div class="app">
    <div class="header">
      <div class="header-top">
        <div>
          <div class="header-title">🌿 Miu 客戶關懷</div>
          <div class="header-sub" id="clientCount">共 0 位客戶</div>
        </div>
        <button class="btn-new" onclick="openNewModal()"><i class="ti ti-user-plus"></i> 新增客戶</button>
      </div>
      <div class="search-bar">
        <i class="ti ti-search"></i>
        <input type="text" id="searchInput" placeholder="搜尋客戶姓名…" oninput="renderList()"/>
      </div>
    </div>
    <div class="statusbar">
      <div class="s-user"><i class="ti ti-user-circle" style="font-size:14px;flex-shrink:0"></i><span class="s-email" id="userEmail"></span></div>
      <div class="s-right">
        <span class="sync-dot" id="syncDot"><i class="ti ti-cloud-check"></i> 已同步</span>
        <button class="btn-out" onclick="signOut()">登出</button>
      </div>
    </div>
    <div class="chips" id="chipsRow"></div>
<div id="birthdayBanner" style="display:none;margin:0 16px 12px;background:linear-gradient(135deg,#f87ab2,#a96cdc);border-radius:16px;padding:14px 16px;cursor:pointer;" onclick="toggleBirthdayPanel()">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:22px;">🎂</span>
      <div>
        <div style="font-size:15px;font-weight:700;color:#fff;" id="birthdayTitle">本月壽星</div>
        <div style="font-size:12px;color:rgba(255,255,255,.8);" id="birthdaySubtitle"></div>
      </div>
    </div>
    <i class="ti ti-chevron-right" style="color:#fff;font-size:18px;" id="birthdayChevron"></i>
  </div>
</div>
<div id="birthdayPanel" style="display:none;margin:0 16px 12px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);">
  <div style="background:linear-gradient(135deg,#f87ab2,#a96cdc);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;">
    <div style="font-size:15px;font-weight:700;color:#fff;">🎂 本月壽星</div>
    <button onclick="toggleBirthdayPanel()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;"><i class="ti ti-x"></i></button>
  </div>
  <div id="birthdayList" style="padding:8px 0;"></div>
</div>
    <div class="list" id="clientList"></div>
  </div>
</div>

<!-- Detail Panel -->
<div class="panel" id="detailPanel">
  <div class="panel-header">
    <button class="btn-back" onclick="closeDetail()"><i class="ti ti-chevron-left"></i> 返回</button>
    <span class="panel-htitle" id="panelTitle"></span>
    <button class="btn-done" onclick="saveClient()">儲存</button>
  </div>
  <div id="panelBody"></div>
  <button class="btn-del-client" onclick="deleteClient()"><i class="ti ti-trash"></i> 刪除此客戶</button>
</div>

<!-- New Client Modal -->
<div class="modal-bg" id="newModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">新增客戶 🌸</div>
    <div>
      <div style="font-size:15px;font-weight:600;color:var(--text2);margin-bottom:7px;">姓名 *</div>
      <input class="minput" type="text" id="newName" placeholder="請輸入姓名"/>
    </div>
    <div>
      <div style="font-size:15px;font-weight:600;color:var(--text2);margin-bottom:7px;">生日</div>
      <input class="minput" type="date" id="newBday"/>
    </div>
    <div class="mactions">
      <button class="btn-mcancel" onclick="closeNewModal()">取消</button>
      <button class="btn-mok" onclick="createClient()">新增</button>
    </div>
  </div>
</div>

<!-- Add Tag Modal -->
<div class="modal-bg" id="tagModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">新增標籤 🏷️</div>
    <div>
      <div style="font-size:15px;font-weight:600;color:var(--text2);margin-bottom:7px;">標籤名稱（最多6字）</div>
      <input class="minput" type="text" id="tagName" placeholder="例：VIP、敏感肌、電話客…" maxlength="6"/>
    </div>
    <div>
      <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;">選擇顏色</div>

<script>
const CLIENT_ID='543207730758-9ts36ee65ientbnj0oldfp2qk7k1uc0r.apps.googleusercontent.com';
const SHEET_ID='184tkzxwG2jTnf3amFlEtpdjul_LFWreMLIIfBDK1U0E';
const SHEET_TITLE='Miu客戶關懷';
const TAG_SHEET='標籤設定';
const TAG_COLORS=['#34c79a','#7ec8e3','#b39ddb','#f48fb1','#ff9500','#ff3b30','#007aff','#5ac8fa','#4cd964','#ffcc00'];
const GRAD_MAP={'#34c79a':'135deg,#34c79a,#00c9ff','#7ec8e3':'135deg,#7ec8e3,#c44dff','#b39ddb':'135deg,#c44dff,#ff6b9d','#f48fb1':'135deg,#ff6b9d,#ff9a3c','#ff9500':'135deg,#ff9500,#ffcc00','#ff3b30':'135deg,#ff3b30,#ff6b9d','#007aff':'135deg,#4d79ff,#c44dff','#5ac8fa':'135deg,#5ac8fa,#4d79ff','#4cd964':'135deg,#4cd964,#34c79a','#ffcc00':'135deg,#ffcc00,#ff9500'};

function showToast(msg,type,dur){
  dur=dur||2000;
  const t=document.getElementById('toast');

function setSyncDot(s){

  else{el.className='sync-dot err';el.innerHTML='<i class="ti ti-cloud-off"></i> 失敗';}
}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(function(){syncAll(true);},1500);}

// Auto refresh token every 45 mins
setInterval(function(){
  const email=localStorage.getItem('miu_email');
  if(!email||!accessToken)return;
  google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file email profile',
    hint:email,
    prompt:'',
    callback:function(resp){
      if(!resp.error){
        accessToken=resp.access_token;
        localStorage.setItem('miu_token',resp.access_token);
        localStorage.setItem('miu_token_ts',Date.now().toString());
      }
    }
  }).requestAccessToken();
}, 45*60*1000);
function tagById(id){return tags.find(function(t){return t.id===id;})||{name:id,color:'#aaa'};}
function grad(color){return GRAD_MAP[color]||'135deg,'+color+','+color;}

// ── Auth ──
async function onSignedIn(token, email){
  accessToken=token;
  localStorage.setItem('miu_token', token);
  localStorage.setItem('miu_email', email);
  localStorage.setItem('miu_token_ts', Date.now().toString());
  document.getElementById('userEmail').textContent=email;
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  await loadTags();
  await loadClients();
  renderChips();renderList();renderBirthdayBanner();
}

function signIn(){
  google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file email profile',
    callback:async function(resp){
      if(resp.error){showToast('登入失敗','err');return;}
      const info=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+resp.access_token}}).then(function(r){return r.json();});
      await onSignedIn(resp.access_token, info.email||'');
    }
  }).requestAccessToken();
}

function signOut(){
  if(accessToken)google.accounts.oauth2.revoke(accessToken,function(){});
  accessToken=null;
  localStorage.removeItem('miu_token');
  localStorage.removeItem('miu_email');
  localStorage.removeItem('miu_token_ts');
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('mainApp').style.display='none';
}

async function tryAutoLogin(){
  const token=localStorage.getItem('miu_token');
  const email=localStorage.getItem('miu_email');
  const ts=parseInt(localStorage.getItem('miu_token_ts')||'0');
  // Token valid for 50 mins (Google tokens last 60 mins)
  if(token && email && (Date.now()-ts < 50*60*1000)){
    // Verify token still valid
    try{
      const test=await fetch('https://www.googleapis.com/oauth2/v3/tokeninfo?access_token='+token);
      const data=await test.json();
      if(data.email || data.sub){
        await onSignedIn(token, email);
        return;
      }
    }catch(e){}
  }
  // Token expired - try silent refresh
  if(email){
    try{
      await new Promise(function(resolve, reject){
        google.accounts.oauth2.initTokenClient({
          client_id:CLIENT_ID,
          scope:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file email profile',
          hint:email,
          prompt:'',
          callback:async function(resp){
            if(resp.error){reject(resp.error);return;}
            await onSignedIn(resp.access_token, email);
            resolve();
          }
        }).requestAccessToken();
      });
      return;
    }catch(e){}
  }
  // Show login screen
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}

// ── Sheets ──
async function sheetsReq(path,method,body){
  method=method||'GET';
  const opts={method:method,headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  return fetch('https://sheets.googleapis.com/v4/spreadsheets'+path,opts).then(function(r){return r.json();});
}
async function loadClients(){
  setSyncDot('syncing');
  try{
    const res=await sheetsReq('/'+SHEET_ID+'/values/'+encodeURIComponent(SHEET_TITLE+'!A2:F'));
    const rows=res.values||[];
    clients=rows.map(function(r){return{id:r[0]||'',name:r[1]||'',birthday:r[2]||'',tags:r[3]?r[3].split(',').filter(Boolean):[],records:r[4]?(function(){try{return JSON.parse(r[4]);}catch(e){return[];}})():[],createdAt:r[5]||'',code:r[6]||''};}).filter(function(c){return c.id;});
    setSyncDot('ok');
  }catch(e){setSyncDot('err');}
}
async function loadTags(){
  try{
    const res=await sheetsReq('/'+SHEET_ID+'/values/'+encodeURIComponent(TAG_SHEET+'!A2:C'));
    const rows=res.values||[];
    if(rows.length){tags=rows.map(function(r){return{id:r[0]||'',name:r[1]||'',color:r[2]||'#34c79a'};}).filter(function(t){return t.id;});}
  }catch(e){}
}
async function syncAll(silent){
  if(!accessToken||isSyncing)return;
  isSyncing=true;setSyncDot('syncing');
  try{
    const cv=[['ID','姓名','生日','標籤','紀錄JSON','建立時間']].concat(clients.map(function(c){return[c.id,c.name,c.birthday||'',c.tags.join(','),JSON.stringify(c.records||[]),c.createdAt||'',c.code||''];}));
    await sheetsReq('/'+SHEET_ID+'/values/'+encodeURIComponent(SHEET_TITLE+'!A1')+'?valueInputOption=RAW','PUT',{values:cv});
    const tv=[['ID','名稱','顏色']].concat(tags.map(function(t){return[t.id,t.name,t.color];}));
    await sheetsReq('/'+SHEET_ID+'/values/'+encodeURIComponent(TAG_SHEET+'!A1')+'?valueInputOption=RAW','PUT',{values:tv});
    setSyncDot('ok');
    if(!silent)showToast('已同步','ok');
  }catch(e){setSyncDot('err');showToast('同步失敗','err');}
  isSyncing=false;
}

// ── Chips ──
function renderChips(){
  const row=document.getElementById('chipsRow');
  let html='<button class="chip'+(currentFilter===''?' active':'')+'" style="'+(currentFilter===''?'background:linear-gradient(135deg,var(--mint),var(--g2));':'')+'" onclick="setFilter(\'\')">全部</button>';
  tags.forEach(function(t){
    const on=currentFilter===t.id;
    html+='<button class="chip'+(on?' active':'')+'" style="'+(on?'background:linear-gradient('+grad(t.color)+');':'')+'" onclick="setFilter(\''+t.id+'\')">'+t.name+'</button>';
  });

}
function setFilter(f){currentFilter=f;renderChips();renderList();renderBirthdayBanner();}

function getBirthdayClients(){
  const now=new Date();
  const month=now.getMonth()+1;
  return clients.filter(function(c){
    if(!c.birthday)return false;
    const parts=c.birthday.split('-');
    if(parts.length<2)return false;
    return parseInt(parts[1])===month;
  }).sort(function(a,b){
    return parseInt(a.birthday.split('-')[2]||0)-parseInt(b.birthday.split('-')[2]||0);
  });
}

function renderBirthdayBanner(){
  const list=getBirthdayClients();
  const banner=document.getElementById('birthdayBanner');
  const subtitle=document.getElementById('birthdaySubtitle');
  if(list.length>0){
    banner.style.display='block';

  } else {
    banner.style.display='none';
    document.getElementById('birthdayPanel').style.display='none';
  }
}

      '<div style="flex:1;">'+
      '<div style="font-size:16px;font-weight:600;color:var(--text1);">'+c.name+'</div>'+

// ── List ──
function initials(n){return n?n.slice(0,2):'??';}
function tagAbbr(name){
  const map={'舊客':'舊','未成交':'未','電話客':'電','客訴':'訴'};
  if(map[name])return map[name];
  return name.slice(0,1);
}
function renderList(){
  const q=document.getElementById('searchInput').value.trim();
  const list=clients.filter(function(c){
    if(q&&!c.name.includes(q))return false;
    if(currentFilter&&!c.tags.includes(currentFilter))return false;
    return true;
  });
  document.getElementById('clientCount').textContent='共 '+clients.length+' 位客戶';
  const el=document.getElementById('clientList');
  if(!list.length){
    el.innerHTML='<div class="empty"><i class="ti ti-heart-off" style="color:var(--mint-light)"></i><div class="empty-t">尚無客戶資料</div><div class="empty-s">點右上角「新增客戶」開始使用</div></div>';
    return;
  }
  el.innerHTML=list.map(function(c){
    const sorted=(c.records||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
    const last=sorted[0]||null;
    const ft=c.tags[0]?tagById(c.tags[0]):null;
    const accentGrad=ft?grad(ft.color):'135deg,#a8edcc,#7ec8e3';
    const avatarBg=ft?'linear-gradient('+grad(ft.color)+')':'linear-gradient(135deg,#a8edcc,#7ec8e3)';
    const tpills=c.tags.map(function(tid){const t=tagById(tid);return'<span class="card-tag-pill" style="background:'+t.color+'20;color:'+t.color+';">'+t.name+'</span>';}).join('');
    return '<div class="client-card" onclick="openDetail(\''+c.id+'\')">'+
      '<div class="card-accent" style="background:linear-gradient('+accentGrad+')"></div>'+
      '<div class="card-body">'+
      '<div class="avatar" style="background:'+avatarBg+';color:#fff;">'+initials(c.name)+'</div>'+
      '<div class="card-info">'+
      '<div class="card-name">'+c.name+(c.code?' <span style="font-size:13px;font-weight:500;color:var(--text3);background:#f0f0f0;padding:2px 8px;border-radius:10px;">#'+c.code+'</span>':'')+'</div>'+
      (c.birthday?'<div class="card-bday"><i class="ti ti-cake" style="font-size:11px;vertical-align:-1px"></i> '+c.birthday+'</div>':'')+
      (tpills?'<div class="card-tags">'+tpills+'</div>':'')+
      '</div><i class="ti ti-chevron-right card-chevron"></i></div>'+
      (last?'<div class="card-last"><i class="ti ti-calendar-event" style="font-size:12px"></i>'+last.date+(last.procedure?'・'+last.procedure:'')+'</div>':'')+
      '</div>';

// ── Detail ──
function openDetail(id){
  currentId=id;
  const c=clients.find(function(x){return x.id===id;});
  document.getElementById('panelTitle').textContent=c.name;
  renderDetail(c);
  document.getElementById('detailPanel').classList.add('open');

function openNoteModal(rid, encodedNote){

function closeNoteModal(){

document.getElementById('noteModal').addEventListener('click',function(e){if(e.target===this)closeNoteModal();});

function closeDetail(){
  document.getElementById('detailPanel').classList.remove('open');
  currentId=null;renderList();renderBirthdayBanner();
}
function renderDetail(c){
  const sorted=(c.records||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  const tagChips=tags.map(function(t){
    const on=c.tags.includes(t.id);
    return '<button class="tag-pill'+(on?' on':'')+'" style="'+(on?'background:linear-gradient('+grad(t.color)+');border-color:transparent;':'')+'" onclick="toggleTag(\''+t.id+'\',this,\''+t.color+'\')">'+t.name+'</button>';
  }).join('');
  const recColors=['linear-gradient(160deg,#fce8f4,#ede4ff)','linear-gradient(160deg,#e4eeff,#fce8f4)','linear-gradient(160deg,#fff4e0,#e2f8ee)','linear-gradient(160deg,#ede4ff,#e4eeff)','linear-gradient(160deg,#fdeef7,#e4eeff)'];
  const recsHtml=sorted.map(function(r,idx){
    return '<div class="rec-card" style="background:'+recColors[idx%recColors.length]+';">'+
      '<div class="rec-top">'+
      '<input type="date" class="rec-date" value="'+r.date+'" onchange="updateRec(\''+r.id+'\',\'date\',this.value)"/>'+
      '<button class="btn-recdel" onclick="deleteRec(\''+r.id+'\')"><i class="ti ti-x"></i></button>'+
      '</div>'+
      '<div class="rec-field"><div class="rec-flabel">療程項目</div><input type="text" value="'+(r.procedure||'')+'" placeholder="水光、電波、玻尿酸…" onchange="updateRec(\''+r.id+'\',\'procedure\',this.value)"/></div>'+

      '<div class="rec-field"><div class="rec-flabel">小筆記</div>'+
      '<div class="note-wrap">'+
      (r.note?
        '<div class="note-preview">'+r.note.replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</div>'+
        '<button class="btn-expand" onclick="openNoteModal(\''+r.id+'\',\''+encodeURIComponent(r.note||'')+'\')">' +
        '<i class="ti ti-arrows-maximize" style="font-size:13px"></i> 展開全文</button>'
        :'<textarea class="note-textarea" placeholder="私人備註…" onchange="updateRec(\''+r.id+'\',\'note\',this.value)"></textarea>')+
      '</div></div>'+
      '</div>';
  }).join('');

  document.getElementById('panelBody').innerHTML=
    '<div class="form-card"><div class="form-card-title">基本資料</div>'+
    '<div class="frow"><span class="flabel">姓名</span><input class="finput" type="text" id="edit-name" value="'+c.name+'" oninput="liveUpdate(\'name\',this.value)" placeholder="姓名"/></div>'+
    '<div class="frow"><span class="flabel">編號</span><input class="finput" type="text" id="edit-code" value="'+(c.code||'')+'" oninput="liveUpdate(\'code\',this.value)" placeholder="選填"/></div>'+
    '<div class="frow"><span class="flabel">生日</span><input class="finput" type="date" id="edit-bday" value="'+(c.birthday||'')+'" onchange="liveUpdate(\'birthday\',this.value)"/></div>'+
    '</div>'+
    '<div class="form-card"><div class="form-card-title">標籤</div>'+
    '<div class="tags-area" id="detailTags">'+tagChips+
    '<button class="btn-newtag" onclick="openTagModal()"><i class="ti ti-plus" style="font-size:13px"></i> 新增標籤</button>'+
    '</div></div>'+
    '<div class="rec-hdr"><span class="rec-hdr-t">預約紀錄</span>'+
    '<button class="btn-addrec" onclick="addRecord()"><i class="ti ti-plus"></i> 新增紀錄</button></div>'+
    (recsHtml||'<div class="no-rec">尚無紀錄，點「新增紀錄」開始記錄</div>');
}

function liveUpdate(f,v){const c=clients.find(function(x){return x.id===currentId;});if(c){c[f]=v;if(f==='name')document.getElementById('panelTitle').textContent=v||'客戶資料';}}
function toggleTag(k,btn,color){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  if(c.tags.includes(k)){c.tags=c.tags.filter(function(t){return t!==k;});btn.classList.remove('on');btn.style.background='';btn.style.borderColor='';}
  else{c.tags.push(k);btn.classList.add('on');btn.style.background='linear-gradient('+grad(color)+')';btn.style.borderColor='transparent';}
}
function addRecord(){const c=clients.find(function(x){return x.id===currentId;});if(!c)return;const r={id:Date.now().toString(),date:new Date().toISOString().slice(0,10),procedure:'',note:''};c.records=c.records||[];c.records.unshift(r);renderDetail(c);}
function updateRec(rid,f,v){const c=clients.find(function(x){return x.id===currentId;});if(!c)return;const r=c.records.find(function(r){return r.id===rid;});if(r)r[f]=v;}
function deleteRec(rid){const c=clients.find(function(x){return x.id===currentId;});if(!c)return;c.records=c.records.filter(function(r){return r.id!==rid;});renderDetail(c);}
function saveClient(){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  c.name=document.getElementById('edit-name').value;
  c.birthday=document.getElementById('edit-bday').value;
  const codeEl=document.getElementById('edit-code');if(codeEl)c.code=codeEl.value;
  scheduleSync();showToast('儲存中…','ok');
}
function deleteClient(){
  const c=clients.find(function(x){return x.id===currentId;});
  if(!c)return;
  const first=confirm('⚠️ 確定要刪除「'+c.name+'」嗎？\n\n刪除後資料將無法復原！');
  if(!first)return;
  const second=confirm('再次確認：真的要永久刪除「'+c.name+'」的所有資料嗎？');
  if(!second)return;
  clients=clients.filter(function(x){return x.id!==currentId;});
  closeDetail();scheduleSync();
  showToast('已刪除 '+c.name,'ok');
}

function closeTagModal(){document.getElementById('tagModal').classList.remove('open');}
function pickColor(c,el){newTagColor=c;document.querySelectorAll('.cdot').forEach(function(d){d.classList.remove('on');});el.classList.add('on');}
function confirmAddTag(){
  const name=document.getElementById('tagName').value.trim();if(!name){alert('請輸入標籤名稱');return;}
  tags.push({id:'tag_'+Date.now(),name:name,color:newTagColor});
  closeTagModal();renderChips();
  const c=clients.find(function(x){return x.id===currentId;});if(c)renderDetail(c);
  scheduleSync();showToast('標籤已新增 🏷️','ok');
}
document.getElementById('tagModal').addEventListener('click',function(e){if(e.target===this)closeTagModal();});
</script>
