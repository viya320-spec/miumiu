<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Miu客戶關懷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --p1:#b8927a;--p2:#8a7d9e;--p3:#7a9e9e;
  --bg:#f5f2ee;--card:#fff;
  --t1:#3a3530;--t2:#7a6e65;--t3:#b0a89e;
  --sep:rgba(120,100,80,.08);
  --sh:0 4px 20px rgba(100,80,60,.08);
  --sh2:0 2px 10px rgba(100,80,60,.06);
  --r:14px;--rl:20px;--rxl:26px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--t1);font-size:16px;line-height:1.5;min-height:100vh;}

/* Loading */
#loadingScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;background:linear-gradient(145deg,#f2ece6,#ece8f0,#e6ecec);}
.load-blob{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#b8927a,#8a7d9e);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 28px rgba(100,80,120,.15);}
.load-title{font-size:20px;font-weight:700;color:var(--t1);}
.load-sub{font-size:14px;color:var(--t2);}

/* Login */
#loginScreen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:22px;padding:40px 28px;background:linear-gradient(145deg,#f2ece6,#ece8f0,#e6ecec);}
.login-blob{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#b8927a,#8a7d9e);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 28px rgba(100,80,120,.15);}
.login-title{font-size:26px;font-weight:800;background:linear-gradient(135deg,#b8927a,#8a7d9e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.login-sub{font-size:14px;color:var(--t2);text-align:center;line-height:1.7;}
.btn-google{display:flex;align-items:center;gap:12px;padding:16px 24px;font-size:16px;font-weight:600;border:1.5px solid #e0d8f0;border-radius:var(--rl);background:#fff;color:var(--t1);cursor:pointer;width:100%;justify-content:center;box-shadow:var(--sh);}
.btn-google svg{width:22px;height:22px;flex-shrink:0;}

/* App */
#mainApp{display:none;}
.header{background:linear-gradient(135deg,#b8927a 0%,#8a7d9e 60%,#7a9e9e 100%);padding:16px 18px 14px;position:sticky;top:0;z-index:10;}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.header-title{font-size:20px;font-weight:800;color:#fff;}
.header-count{font-size:12px;color:rgba(255,255,255,.75);margin-top:1px;}
.btn-new{display:flex;align-items:center;gap:5px;padding:9px 16px;font-size:14px;font-weight:700;border:1.5px solid rgba(255,255,255,.5);border-radius:30px;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;backdrop-filter:blur(8px);}
.search-bar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border-radius:var(--r);padding:10px 14px;}
.search-bar i{font-size:17px;color:var(--t3);}
.search-bar input{flex:1;border:none;background:transparent;font-size:15px;color:var(--t1);outline:none;}
.search-bar input::placeholder{color:var(--t3);}

/* Status bar */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:7px 18px;background:linear-gradient(135deg,#f2ede8,#ece8f0);border-bottom:1px solid var(--sep);}
.s-user{font-size:12px;color:#8a7d9e;font-weight:600;display:flex;align-items:center;gap:4px;overflow:hidden;}
.s-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;}
.s-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sync-dot{font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px;color:#8a7d9e;}
.sync-dot.syncing{color:#ff9500;}
.sync-dot.err{color:#ff3b30;}
.btn-out{font-size:12px;color:var(--t2);background:rgba(0,0,0,.06);border:none;border-radius:8px;cursor:pointer;padding:4px 10px;}

/* Birthday banner */
.bday-banner{margin:12px 16px 0;background:linear-gradient(135deg,#b8927a,#8a7d9e);border-radius:var(--rl);padding:13px 16px;cursor:pointer;display:none;}
.bday-banner-row{display:flex;align-items:center;justify-content:space-between;}
.bday-banner-left{display:flex;align-items:center;gap:10px;}
.bday-banner-title{font-size:15px;font-weight:700;color:#fff;}
.bday-banner-sub{font-size:12px;color:rgba(255,255,255,.8);margin-top:1px;}
.bday-panel{margin:8px 16px 0;background:var(--card);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh2);display:none;}
.bday-panel-hdr{background:linear-gradient(135deg,#b8927a,#8a7d9e);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;}
.bday-panel-title{font-size:15px;font-weight:700;color:#fff;}
.btn-bday-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0;}
.bday-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--sep);cursor:pointer;}
.bday-item:last-child{border-bottom:none;}
.bday-item:active{opacity:.7;}

/* Chips */
.chips{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 16px;border-radius:30px;font-size:14px;font-weight:600;border:none;background:var(--card);color:var(--t2);cursor:pointer;white-space:nowrap;box-shadow:var(--sh2);flex-shrink:0;}
.chip.active{color:#fff;}

/* Client list */
.list{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;}
.client-card{background:var(--card);border-radius:var(--rl);box-shadow:var(--sh2);overflow:hidden;cursor:pointer;}
.client-card:active{transform:scale(.98);}
.card-accent{height:4px;opacity:.75;}
.card-body{display:flex;align-items:center;gap:12px;padding:13px 16px;}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0;}
.card-info{flex:1;min-width:0;}
.card-name{font-size:17px;font-weight:700;color:var(--t1);margin-bottom:2px;}
.card-bday{font-size:12px;color:var(--t2);margin-bottom:4px;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;}
.card-tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;}
.card-arrow{color:var(--t3);font-size:16px;flex-shrink:0;}
.card-last{font-size:12px;color:var(--t3);padding:0 16px 11px 74px;}
.empty{text-align:center;padding:60px 20px;}
.empty i{font-size:50px;display:block;margin-bottom:14px;color:#d0c0f0;}
.empty-t{font-size:17px;font-weight:600;color:var(--t2);margin-bottom:6px;}
.empty-s{font-size:13px;color:var(--t3);}

/* Panel */
.panel{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:90px;}
.panel.open{transform:translateX(0);}
.panel-nav{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(135deg,#b8927a 0%,#8a7d9e 60%,#7a9e9e 100%);position:sticky;top:0;z-index:5;}
.btn-back{display:flex;align-items:center;gap:3px;font-size:15px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:20px;padding:7px 14px;cursor:pointer;}
.panel-nav-title{flex:1;text-align:center;font-size:17px;font-weight:700;color:#fff;}
.btn-done{font-size:15px;font-weight:800;color:#b8927a;background:rgba(255,255,255,.92);border:none;border-radius:20px;padding:7px 16px;cursor:pointer;}

/* Form */
.form-card{background:var(--card);border-radius:var(--rl);margin:14px 16px 0;box-shadow:var(--sh2);overflow:hidden;}
.form-title{font-size:12px;font-weight:700;color:var(--t3);padding:13px 16px 5px;letter-spacing:.5px;text-transform:uppercase;}
.frow{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--sep);min-height:50px;}
.frow:last-child{border-bottom:none;}
.flabel{font-size:15px;font-weight:600;color:var(--t1);width:72px;flex-shrink:0;}
.finput{flex:1;padding:13px 0;font-size:16px;border:none;background:transparent;color:var(--t1);outline:none;text-align:right;}
.finput::placeholder{color:var(--t3);}

/* Tags */
.tags-area{padding:12px 16px 14px;display:flex;flex-wrap:wrap;gap:8px;}
.tag-pill{padding:8px 18px;border-radius:30px;font-size:15px;font-weight:600;border:2px solid var(--sep);background:var(--bg);color:var(--t2);cursor:pointer;}
.tag-pill.on{color:#fff;border-color:transparent;}
.btn-new-tag{padding:8px 16px;border-radius:30px;font-size:15px;font-weight:600;border:2px dashed #8a7d9e;background:transparent;color:#8a7d9e;cursor:pointer;display:flex;align-items:center;gap:4px;}

/* Records */
.rec-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;}
.rec-hdr-t{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;}
.btn-add-rec{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:#8a7d9e;background:rgba(138,125,158,.1);border:none;border-radius:20px;padding:7px 14px;cursor:pointer;}
.rec-card{border-radius:var(--rl);margin:0 16px 14px;box-shadow:var(--sh2);overflow:hidden;border:2px solid rgba(255,255,255,.8);}
.rec-top{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.3);}
.rec-date{font-size:17px;font-weight:700;color:#8a7d9e;border:none;background:transparent;outline:none;}
.btn-rec-del{background:none;border:none;color:#ff3b30;font-size:22px;cursor:pointer;padding:0 4px;}
.rec-field{padding:0 16px;border-bottom:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.4);}
.rec-field:last-child{border-bottom:none;}
.rec-flabel{font-size:11px;font-weight:700;color:var(--t3);padding-top:10px;letter-spacing:.4px;text-transform:uppercase;}
.rec-field input{width:100%;font-size:16px;border:none;background:transparent;color:var(--t1);outline:none;padding:6px 0 10px;}
.rec-field input::placeholder{color:var(--t3);}
.note-wrap{padding:6px 0 10px;}
.note-full{font-size:16px;color:var(--t1);line-height:1.8;white-space:pre-wrap;word-break:break-word;padding-bottom:8px;}
.note-empty{font-size:16px;border:none;background:transparent;color:var(--t1);outline:none;width:100%;resize:none;line-height:1.7;min-height:70px;padding:0;}
.note-empty::placeholder{color:var(--t3);}


/* Delete */
.btn-del{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 16px 0;width:calc(100% - 32px);padding:15px;font-size:16px;font-weight:600;color:#ff3b30;background:var(--card);border:none;border-radius:var(--rl);cursor:pointer;box-shadow:var(--sh2);}

/* Modals */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:40;display:none;align-items:flex-end;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:var(--rxl) var(--rxl) 0 0;padding:22px 20px 50px;width:100%;display:flex;flex-direction:column;gap:14px;}
.modal-handle{width:36px;height:4px;background:var(--t3);border-radius:4px;margin:0 auto 2px;}
.modal-title{font-size:18px;font-weight:800;color:var(--t1);}
.minput{padding:14px 16px;font-size:16px;border:1.5px solid #e8e0f8;border-radius:var(--r);background:#faf8ff;color:var(--t1);width:100%;outline:none;}
.minput:focus{border-color:#8a7d9e;}
.mrow{display:flex;gap:10px;}
.btn-mcancel{flex:1;padding:14px;font-size:16px;border:1.5px solid #e8e0f8;border-radius:var(--rl);background:#fff;color:var(--t2);cursor:pointer;font-weight:600;}
.btn-mok{flex:1;padding:14px;font-size:16px;font-weight:700;border:none;border-radius:var(--rl);background:linear-gradient(135deg,#b8927a,#8a7d9e);color:#fff;cursor:pointer;}
.color-row{display:flex;gap:10px;flex-wrap:wrap;}
.cdot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s;}
.cdot.on{border-color:var(--t1);transform:scale(1.15);}

/* Note modal */
.note-modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;}
.note-modal-bg.open{display:flex;}
.note-modal{background:#fff;border-radius:var(--rxl) var(--rxl) 0 0;padding:20px 20px 50px;width:100%;max-height:82vh;display:flex;flex-direction:column;gap:12px;}
.note-modal-top{display:flex;align-items:center;justify-content:space-between;}
.note-modal-title{font-size:17px;font-weight:700;color:var(--t1);}
.btn-note-close{font-size:15px;font-weight:700;color:#8a7d9e;background:none;border:none;cursor:pointer;}
.note-modal-body{font-size:17px;color:var(--t1);line-height:1.8;overflow-y:auto;flex:1;white-space:pre-wrap;word-break:break-all;padding:4px 0;}

/* Toast */
.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(26,16,40,.85);color:#fff;padding:11px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:60;transition:transform .28s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(10px);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:rgba(100,180,120,.92);}
.toast.err{background:rgba(255,59,48,.9);}
.spinning{display:inline-block;animation:spin .8s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Loading -->
<div id="loadingScreen">
  <div class="load-blob">🌿</div>
  <div class="load-title">Miu 客戶關懷</div>
  <div class="load-sub">載入中…</div>
</div>

<!-- Login -->
<div id="loginScreen">
  <div class="login-blob">🌿</div>
  <div class="login-title">Miu 客戶關懷</div>
  <div class="login-sub">登入 Google 帳號<br>資料自動同步至您的 Google Sheets</div>
  <button class="btn-google" onclick="signIn()">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    使用 Google 帳號登入
  </button>
</div>

<!-- Main App -->
<div id="mainApp">
  <div class="header">
    <div class="header-row">
      <div>
        <div class="header-title">🌿 Miu 客戶關懷</div>
        <div class="header-count" id="headerCount">共 0 位客戶</div>
      </div>
      <button class="btn-new" onclick="openNewModal()"><i class="ti ti-user-plus"></i> 新增</button>
    </div>
    <div class="search-bar">
      <i class="ti ti-search"></i>
      <input type="text" id="searchInput" placeholder="搜尋客戶姓名…" oninput="renderList()"/>
    </div>
  </div>

  <div class="statusbar">
    <div class="s-user"><i class="ti ti-user-circle" style="font-size:14px;flex-shrink:0"></i><span class="s-email" id="userEmail"></span></div>
    <div class="s-right">
      <span class="sync-dot" id="syncDot"><i class="ti ti-cloud-check"></i> 已同步</span>
      <button class="btn-out" onclick="signOut()">登出</button>
    </div>
  </div>

  <div class="bday-banner" id="bdayBanner" onclick="toggleBdayPanel()">
    <div class="bday-banner-row">
      <div class="bday-banner-left">
        <span style="font-size:24px;">🎂</span>
        <div>
          <div class="bday-banner-title">本月壽星</div>
          <div class="bday-banner-sub" id="bdaySub"></div>
        </div>
      </div>
      <i class="ti ti-chevron-right" style="color:#fff;font-size:18px;" id="bdayChevron"></i>
    </div>
  </div>

  <div class="bday-panel" id="bdayPanel">
    <div class="bday-panel-hdr">
      <div class="bday-panel-title">🎂 本月壽星</div>
      <button class="btn-bday-close" onclick="toggleBdayPanel()"><i class="ti ti-x"></i></button>
    </div>
    <div id="bdayList"></div>
  </div>

  <div class="chips" id="chipsRow"></div>
  <div class="list" id="clientList"></div>
</div>

<!-- Detail Panel -->
<div class="panel" id="detailPanel">
  <div class="panel-nav">
    <button class="btn-back" onclick="closeDetail()"><i class="ti ti-chevron-left"></i> 返回</button>
    <span class="panel-nav-title" id="panelTitle"></span>
    <button class="btn-done" onclick="saveClient()">儲存</button>
  </div>
  <div id="panelBody"></div>
  <button class="btn-del" onclick="deleteClient()"><i class="ti ti-trash"></i> 刪除此客戶</button>
</div>

<!-- New Client Modal -->
<div class="modal-bg" id="newModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">新增客戶 🌸</div>
    <div><div style="font-size:13px;font-weight:600;color:var(--t2);margin-bottom:7px;">姓名 *</div><input class="minput" type="text" id="newName" placeholder="請輸入姓名"/></div>
    <div><div style="font-size:13px;font-weight:600;color:var(--t2);margin-bottom:7px;">生日</div><input class="minput" type="date" id="newBday"/></div>
    <div class="mrow"><button class="btn-mcancel" onclick="closeModal('newModal')">取消</button><button class="btn-mok" onclick="createClient()">新增</button></div>
  </div>
</div>

<!-- Tag Modal -->
<div class="modal-bg" id="tagModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">新增標籤 🏷️</div>
    <div><div style="font-size:13px;font-weight:600;color:var(--t2);margin-bottom:7px;">標籤名稱（最多6字）</div><input class="minput" type="text" id="tagName" placeholder="例：VIP、敏感肌…" maxlength="6"/></div>
    <div><div style="font-size:13px;font-weight:600;color:var(--t2);margin-bottom:10px;">顏色</div><div class="color-row" id="colorRow"></div></div>
    <div class="mrow"><button class="btn-mcancel" onclick="closeModal('tagModal')">取消</button><button class="btn-mok" onclick="confirmAddTag()">新增</button></div>
  </div>
</div>

<!-- Note Modal -->
<div class="note-modal-bg" id="noteModal">
  <div class="note-modal">
    <div class="note-modal-top">
      <div class="note-modal-title">📝 小筆記</div>
      <button class="btn-note-close" onclick="closeModal('noteModal')">完成</button>
    </div>
    <div class="note-modal-body" id="noteModalBody"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
var CLIENT_ID = '543207730758-9ts36ee65ientbnj0oldfp2qk7k1uc0r.apps.googleusercontent.com';
var SHEET_ID = null; // loaded per user from localStorage
var SHEET_TITLE = 'Miu客戶關懷';
var TAG_SHEET = '標籤設定';
var TAG_COLORS = ['#b8927a','#8a7d9e','#7a9e9e','#c4a882','#9aaa8a','#b88a8a','#8a9aaa','#aa8a9e'];
var REC_COLORS = [
  'linear-gradient(160deg,#f2ede8,#eae8f0)',
  'linear-gradient(160deg,#e8eeee,#f0ede8)',
  'linear-gradient(160deg,#f0ece4,#e8eeea)',
  'linear-gradient(160deg,#eae8f0,#f2ede8)',
  'linear-gradient(160deg,#eaeef0,#f0ebe8)'
];
var DEFAULT_TAGS = [
  {id:'old',name:'舊客',color:'#8aa898'},
  {id:'lost',name:'未成交',color:'#c4a882'},
  {id:'phone',name:'電話客',color:'#8a9aaa'},
  {id:'complain',name:'客訴客',color:'#b88a8a'}
];
var TAG_ABBR_MAP = {'舊客':'舊','未成交':'未','電話客':'電','客訴客':'訴','客訴':'訴'};

var clients = [];
var tags = JSON.parse(JSON.stringify(DEFAULT_TAGS));
var currentFilter = '';
var currentId = null;
var accessToken = null;
var syncTimer = null;
var isSyncing = false;
var newTagColor = TAG_COLORS[0];
var bdayOpen = false;

// ── Utils ──────────────────────────────────────────────────────
function showToast(msg, type, dur) {
  dur = dur || 2000;
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '');
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, dur);
}

function setSyncDot(state) {
  var el = document.getElementById('syncDot');
  if (!el) return;
  if (state === 'syncing') { el.className = 'sync-dot syncing'; el.innerHTML = '<span class="spinning"><i class="ti ti-loader" style="font-size:12px"></i></span> 同步中'; }
  else if (state === 'ok') { el.className = 'sync-dot'; el.innerHTML = '<i class="ti ti-cloud-check"></i> 已同步'; }
  else { el.className = 'sync-dot err'; el.innerHTML = '<i class="ti ti-cloud-off"></i> 失敗'; }
}

function scheduleSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function() { syncAll(true); }, 1500);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function tagById(id) {
  for (var i = 0; i < tags.length; i++) { if (tags[i].id === id) return tags[i]; }
  return { name: id, color: '#aaa' };
}

function tagAbbr(name) {
  return TAG_ABBR_MAP[name] || name.slice(0, 1);
}

function initials(n) { return n ? n.slice(0, 2) : '??'; }

function gradStr(color) {
  // Morandi mapping - any color gets converted to muted morandi version
  var map = {
    '#b8927a': '135deg,#b8927a,#c4a882',
    '#8a7d9e': '135deg,#8a7d9e,#9e96b8',
    '#7a9e9e': '135deg,#7a9e9e,#8ab0aa',
    '#c4a882': '135deg,#c4a882,#b8a078',
    '#9aaa8a': '135deg,#9aaa8a,#7a9e9e',
    '#b88a8a': '135deg,#b88a8a,#9e8a9e',
    '#8a9aaa': '135deg,#8a9aaa,#7a9ab0',
    '#8aa898': '135deg,#8aa898,#7a9e9e',
    '#b88a8a': '135deg,#b88a8a,#9e8898',
    '#aa8a9e': '135deg,#aa8a9e,#8a7d9e',
    '#007aff': '135deg,#8a9aaa,#7a9e9e',
    '#ff9500': '135deg,#c4a882,#b8927a',
    '#ff3b30': '135deg,#b88a8a,#9e8a8a',
    '#34c79a': '135deg,#7a9e9e,#9aaa8a',
    '#4cd964': '135deg,#9aaa8a,#7a9e9e',
    '#5ac8fa': '135deg,#8a9aaa,#9e96b8',
    '#ffcc00': '135deg,#c4a882,#c4b078',
    '#ff6b9d': '135deg,#b8927a,#aa8a9e',
    '#9e68d4': '135deg,#8a7d9e,#9e96b8',
    '#6278cc': '135deg,#8a9aaa,#8a7d9e',
    '#e8709e': '135deg,#b8927a,#aa8a9e',
    '#f0a070': '135deg,#c4a882,#b8927a'
  };
  return map[color] || '135deg,#b8927a,#8a7d9e';
}

// ── Auth ───────────────────────────────────────────────────────
function showScreen(name) {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'none';
  if (name === 'loading') document.getElementById('loadingScreen').style.display = 'flex';
  else if (name === 'login') { document.getElementById('loginScreen').style.display = 'flex'; }
  else document.getElementById('mainApp').style.display = 'block';
}

async function onSignedIn(token, email) {
  accessToken = token;
  localStorage.setItem('miu_token', token);
  localStorage.setItem('miu_email', email);
  localStorage.setItem('miu_ts', Date.now().toString());
  document.getElementById('userEmail').textContent = email;
  showScreen('app');
  // Load per-user sheet ID
  var userKey = 'miu_sheetId_' + email.replace(/[^a-z0-9]/gi,'_');
  SHEET_ID = localStorage.getItem(userKey) || null;
  await initSheet(email, userKey);
  await loadTags();
  await loadClients();
  renderChips();
  renderList();
  renderBdayBanner();
}

function signIn() {
  google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file email profile',
    callback: async function(resp) {
      if (resp.error) { showToast('登入失敗', 'err'); return; }
      var info = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + resp.access_token } }).then(function(r) { return r.json(); });
      await onSignedIn(resp.access_token, info.email || '');
    }
  }).requestAccessToken();
}

function signOut() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken, function() {});
  accessToken = null;
  SHEET_ID = null;
  localStorage.removeItem('miu_token');
  localStorage.removeItem('miu_email');
  localStorage.removeItem('miu_ts');
  showScreen('login');
}

async function tryAutoLogin() {
  var token = localStorage.getItem('miu_token');
  var email = localStorage.getItem('miu_email');
  var ts = parseInt(localStorage.getItem('miu_ts') || '0');
  if (token && email && (Date.now() - ts < 50 * 60 * 1000)) {
    try {
      var res = await fetch('https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=' + token);
      var data = await res.json();
      if (data.email || data.sub) { await onSignedIn(token, email); return; }
    } catch (e) {}
  }
  if (email) {
    try {
      await new Promise(function(resolve, reject) {
        google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file email profile',
          hint: email, prompt: '',
          callback: async function(resp) {
            if (resp.error) { reject(resp.error); return; }
            await onSignedIn(resp.access_token, email);
            resolve();
          }
        }).requestAccessToken();
      });
      return;
    } catch (e) {}
  }
  showScreen('login');
}

// Auto refresh token every 45 mins
setInterval(function() {
  var email = localStorage.getItem('miu_email');
  if (!email || !accessToken) return;
  google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file email profile',
    hint: email, prompt: '',
    callback: function(resp) {
      if (!resp.error) {
        accessToken = resp.access_token;
        localStorage.setItem('miu_token', resp.access_token);
        localStorage.setItem('miu_ts', Date.now().toString());
      }
    }
  }).requestAccessToken();
}, 45 * 60 * 1000);

// ── Sheets ─────────────────────────────────────────────────────
async function initSheet(email, userKey) {
  // Check if existing sheet is valid
  if (SHEET_ID) {
    try {
      var chk = await sheetsReq('/' + SHEET_ID + '?fields=spreadsheetId');
      if (chk.spreadsheetId) return; // Sheet exists and accessible
    } catch(e) {}
    SHEET_ID = null;
  }
  // Search for existing sheet in Drive
  try {
    var search = await fetch("https://www.googleapis.com/drive/v3/files?q=name%3D'Miu客戶關懷系統'%20and%20mimeType%3D'application%2Fvnd.google-apps.spreadsheet'%20and%20trashed%3Dfalse&fields=files(id,name)", {
      headers: { Authorization: 'Bearer ' + accessToken }
    }).then(function(r) { return r.json(); });
    if (search.files && search.files.length > 0) {
      SHEET_ID = search.files[0].id;
      localStorage.setItem(userKey, SHEET_ID);
      showToast('✓ 找到您的試算表', 'ok');
      return;
    }
  } catch(e) {}
  // Create new sheet for this user
  try {
    var res = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        properties: { title: 'Miu客戶關懷系統' },
        sheets: [
          { properties: { title: SHEET_TITLE } },
          { properties: { title: TAG_SHEET } }
        ]
      })
    }).then(function(r) { return r.json(); });
    SHEET_ID = res.spreadsheetId;
    localStorage.setItem(userKey, SHEET_ID);
    // Write headers
    await sheetsReq('/' + SHEET_ID + '/values/' + encodeURIComponent(SHEET_TITLE + '!A1') + '?valueInputOption=RAW', 'PUT',
      { values: [['ID','姓名','生日','標籤','紀錄JSON','建立時間','編號']] });
    await sheetsReq('/' + SHEET_ID + '/values/' + encodeURIComponent(TAG_SHEET + '!A1') + '?valueInputOption=RAW', 'PUT',
      { values: [['ID','名稱','顏色']] });
    showToast('✓ 已建立您的專屬試算表', 'ok');
  } catch(e) {
    showToast('建立試算表失敗，請重試', 'err');
  }
}

async function sheetsReq(path, method, body) {
  method = method || 'GET';
  var opts = { method: method, headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  return fetch('https://sheets.googleapis.com/v4/spreadsheets' + path, opts).then(function(r) { return r.json(); });
}

async function loadClients() {
  setSyncDot('syncing');
  try {
    var res = await sheetsReq('/' + SHEET_ID + '/values/' + encodeURIComponent(SHEET_TITLE + '!A2:G'));
    var rows = res.values || [];
    clients = rows.map(function(r) {
      return {
        id: r[0] || '', name: r[1] || '', birthday: r[2] || '',
        tags: r[3] ? r[3].split(',').filter(Boolean) : [],
        records: r[4] ? (function() { try { return JSON.parse(r[4]); } catch(e) { return []; } })() : [],
        createdAt: r[5] || '', code: r[6] || ''
      };
    }).filter(function(c) { return c.id; });
    setSyncDot('ok');
  } catch(e) { setSyncDot('err'); }
}

async function loadTags() {
  try {
    var res = await sheetsReq('/' + SHEET_ID + '/values/' + encodeURIComponent(TAG_SHEET + '!A2:C'));
    var rows = res.values || [];
    if (rows.length) {
      tags = rows.map(function(r) { return { id: r[0] || '', name: r[1] || '', color: r[2] || '#e8709e' }; }).filter(function(t) { return t.id; });
    }
  } catch(e) {}
}

async function syncAll(silent) {
  if (!accessToken || isSyncing) return;
  isSyncing = true; setSyncDot('syncing');
  try {
    var cv = [['ID','姓名','生日','標籤','紀錄JSON','建立時間','編號']].concat(
      clients.map(function(c) { return [c.id, c.name, c.birthday||'', c.tags.join(','), JSON.stringify(c.records||[]), c.createdAt||'', c.code||'']; })
    );
    await sheetsReq('/' + SHEET_ID + '/values/' + encodeURIComponent(SHEET_TITLE + '!A1') + '?valueInputOption=RAW', 'PUT', { values: cv });
    var tv = [['ID','名稱','顏色']].concat(tags.map(function(t) { return [t.id, t.name, t.color]; }));
    await sheetsReq('/' + SHEET_ID + '/values/' + encodeURIComponent(TAG_SHEET + '!A1') + '?valueInputOption=RAW', 'PUT', { values: tv });
    setSyncDot('ok');
    if (!silent) showToast('已同步', 'ok');
  } catch(e) { setSyncDot('err'); showToast('同步失敗', 'err'); }
  isSyncing = false;
}

// ── Birthday ───────────────────────────────────────────────────
function getBdayClients() {
  var m = new Date().getMonth() + 1;
  return clients.filter(function(c) {
    if (!c.birthday) return false;
    var p = c.birthday.split('-');
    return p.length >= 2 && parseInt(p[1]) === m;
  }).sort(function(a, b) {
    return parseInt((a.birthday.split('-')[2])||0) - parseInt((b.birthday.split('-')[2])||0);
  });
}

function renderBdayBanner() {
  var list = getBdayClients();
  var banner = document.getElementById('bdayBanner');
  if (list.length > 0) {
    banner.style.display = 'block';
    document.getElementById('bdaySub').textContent = '共 ' + list.length + ' 位，記得聯繫她們！';
  } else {
    banner.style.display = 'none';
    document.getElementById('bdayPanel').style.display = 'none';
    bdayOpen = false;
  }
}

function toggleBdayPanel() {
  var panel = document.getElementById('bdayPanel');
  var chevron = document.getElementById('bdayChevron');
  bdayOpen = !bdayOpen;
  if (bdayOpen) {
    panel.style.display = 'block';
    chevron.style.transform = 'rotate(90deg)';
    var list = getBdayClients();
    var html = list.map(function(c) {
      var ft = c.tags[0] ? tagById(c.tags[0]) : null;
      var abg = ft ? 'linear-gradient(' + gradStr(ft.color) + ')' : 'linear-gradient(135deg,#b8927a,#8a7d9e)';
      var atx = ft ? tagAbbr(ft.name) : initials(c.name);
      var day = c.birthday ? parseInt(c.birthday.split('-')[2] || 0) : 0;
      return '<div class="bday-item" onclick="openDetail(\'' + c.id + '\')">' +
        '<div class="avatar" style="background:' + abg + ';width:40px;height:40px;font-size:14px;">' + atx + '</div>' +
        '<div style="flex:1;"><div style="font-size:16px;font-weight:600;color:var(--t1);">' + c.name + '</div>' +
        '<div style="font-size:13px;color:var(--t2);">' + c.birthday + (day ? '　' + day + '日' : '') + '</div></div>' +
        '<span style="font-size:20px;">🎂</span></div>';
    }).join('');
    document.getElementById('bdayList').innerHTML = html;
  } else {
    panel.style.display = 'none';
    chevron.style.transform = '';
  }
}

// ── Chips ──────────────────────────────────────────────────────
function renderChips() {
  var row = document.getElementById('chipsRow');
  var html = '<button class="chip' + (currentFilter === '' ? ' active" style="background:linear-gradient(135deg,var(--p1),var(--p2))' : '"') + '" onclick="setFilter(\'\')">全部</button>';
  tags.forEach(function(t) {
    var on = currentFilter === t.id;
    html += '<button class="chip' + (on ? ' active" style="background:linear-gradient(' + gradStr(t.color) + ')' : '"') + '" onclick="setFilter(\'' + t.id + '\')">' + t.name + '</button>';
  });
  row.innerHTML = html;
}

function setFilter(f) { currentFilter = f; renderChips(); renderList(); }

// ── List ───────────────────────────────────────────────────────
function renderList() {
  var q = document.getElementById('searchInput').value.trim();
  var list = clients.filter(function(c) {
    if (q && c.name.indexOf(q) < 0) return false;
    if (currentFilter && c.tags.indexOf(currentFilter) < 0) return false;
    return true;
  });
  document.getElementById('headerCount').textContent = '共 ' + clients.length + ' 位客戶';
  var el = document.getElementById('clientList');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-heart-off"></i><div class="empty-t">尚無客戶資料</div><div class="empty-s">點右上角「新增」加入第一位客戶</div></div>';
    return;
  }
  el.innerHTML = list.map(function(c) {
    var sorted = (c.records || []).slice().sort(function(a, b) { return b.date.localeCompare(a.date); });
    var last = sorted[0] || null;
    var ft = c.tags[0] ? tagById(c.tags[0]) : null;
    var acg = ft ? gradStr(ft.color) : '135deg,#c0a0e0,#a0b8e0';
    var abg = ft ? 'linear-gradient(' + gradStr(ft.color) + ')' : 'linear-gradient(135deg,#c4a882,#8a7d9e)';
    var atx = ft ? tagAbbr(ft.name) : initials(c.name);
    var tpills = c.tags.map(function(tid) {
      var t = tagById(tid);
      return '<span class="card-tag" style="background:' + t.color + '20;color:' + t.color + ';">' + t.name + '</span>';
    }).join('');
    return '<div class="client-card" onclick="openDetail(\'' + c.id + '\')">' +
      '<div class="card-accent" style="background:linear-gradient(' + acg + ')"></div>' +
      '<div class="card-body">' +
      '<div class="avatar" style="background:' + abg + ';">' + atx + '</div>' +
      '<div class="card-info">' +
      '<div class="card-name">' + c.name + (c.code ? ' <span style="font-size:12px;font-weight:500;color:var(--t3);background:#f0ecff;padding:2px 8px;border-radius:10px;">#' + c.code + '</span>' : '') + '</div>' +
      (c.birthday ? '<div class="card-bday"><i class="ti ti-cake" style="font-size:11px;vertical-align:-1px"></i> ' + c.birthday + '</div>' : '') +
      (tpills ? '<div class="card-tags">' + tpills + '</div>' : '') +
      '</div><i class="ti ti-chevron-right card-arrow"></i></div>' +
      (last ? '<div class="card-last"><i class="ti ti-calendar-event" style="font-size:12px;vertical-align:-1px"></i> ' + last.date + (last.procedure ? '・' + last.procedure : '') + '</div>' : '') +
      '</div>';
  }).join('');
}

// ── Detail ─────────────────────────────────────────────────────
function openDetail(id) {
  currentId = id;
  var c = clients.filter(function(x) { return x.id === id; })[0];
  document.getElementById('panelTitle').textContent = c.name;
  renderDetail(c);
  document.getElementById('detailPanel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  currentId = null; renderList(); renderBdayBanner();
}

function renderDetail(c) {
  var sorted = (c.records || []).slice().sort(function(a, b) { return b.date.localeCompare(a.date); });

  var tagChips = tags.map(function(t) {
    var on = c.tags.indexOf(t.id) >= 0;
    return '<button class="tag-pill' + (on ? ' on" style="background:linear-gradient(' + gradStr(t.color) + ')' : '"') + '" onclick="toggleTag(\'' + t.id + '\',this,\'' + t.color + '\')">' + t.name + '</button>';
  }).join('');

  var recsHtml = sorted.map(function(r, idx) {
    var bg = REC_COLORS[idx % REC_COLORS.length];
    var safeN = r.note ? r.note.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\r\n/g,'<br>').replace(/\n/g,'<br>') : '';
    var noteHtml = r.note
      ? '<div class="note-wrap"><div class="note-full">' + safeN + '</div>'
      : '<div class="note-wrap"><textarea class="note-empty" placeholder="私人備註…" onchange="updateRec(\'' + r.id + '\',\'note\',this.value)"></textarea></div>';

    return '<div class="rec-card" style="background:' + bg + ';">' +
      '<div class="rec-top">' +
      '<input type="date" class="rec-date" value="' + r.date + '" onchange="updateRec(\'' + r.id + '\',\'date\',this.value)"/>' +
      '<button class="btn-rec-del" onclick="deleteRec(\'' + r.id + '\')"><i class="ti ti-x"></i></button>' +
      '</div>' +
      '<div class="rec-field"><div class="rec-flabel">療程項目</div>' +
      '<input type="text" value="' + (r.procedure || '') + '" placeholder="水光、電波、玻尿酸…" onchange="updateRec(\'' + r.id + '\',\'procedure\',this.value)"/></div>' +
      '<div class="rec-field"><div class="rec-flabel">小筆記</div>' + noteHtml + '</div>' +
      '</div>';
  }).join('');

  document.getElementById('panelBody').innerHTML =
    '<div class="form-card"><div class="form-title">基本資料</div>' +
    '<div class="frow"><span class="flabel">姓名</span><input class="finput" type="text" id="edit-name" value="' + c.name + '" oninput="liveUpdate(\'name\',this.value)"/></div>' +
    '<div class="frow"><span class="flabel">編號</span><input class="finput" type="text" id="edit-code" value="' + (c.code||'') + '" oninput="liveUpdate(\'code\',this.value)" placeholder="選填"/></div>' +
    '<div class="frow"><span class="flabel">生日</span><input class="finput" type="date" id="edit-bday" value="' + (c.birthday||'') + '" onchange="liveUpdate(\'birthday\',this.value)"/></div>' +
    '</div>' +
    '<div class="form-card"><div class="form-title">標籤</div>' +
    '<div class="tags-area">' + tagChips +
    '<button class="btn-new-tag" onclick="openTagModal()"><i class="ti ti-plus" style="font-size:13px"></i> 新增標籤</button>' +
    '</div></div>' +
    '<div class="rec-hdr"><span class="rec-hdr-t">預約紀錄</span>' +
    '<button class="btn-add-rec" onclick="addRecord()"><i class="ti ti-plus"></i> 新增紀錄</button></div>' +
    (recsHtml || '<div style="text-align:center;padding:20px;color:var(--t3);font-size:14px;">尚無紀錄，點「新增紀錄」開始</div>');
}

function liveUpdate(f, v) {
  var c = clients.filter(function(x) { return x.id === currentId; })[0];
  if (c) { c[f] = v; if (f === 'name') document.getElementById('panelTitle').textContent = v || '客戶資料'; }
}

function toggleTag(k, btn, color) {
  var c = clients.filter(function(x) { return x.id === currentId; })[0]; if (!c) return;
  var idx = c.tags.indexOf(k);
  if (idx >= 0) { c.tags.splice(idx, 1); btn.classList.remove('on'); btn.style.background = ''; }
  else { c.tags.push(k); btn.classList.add('on'); btn.style.background = 'linear-gradient(' + gradStr(color) + ')'; }
}

function addRecord() {
  var c = clients.filter(function(x) { return x.id === currentId; })[0]; if (!c) return;
  var r = { id: Date.now().toString(), date: new Date().toISOString().slice(0, 10), procedure: '', note: '' };
  c.records = c.records || []; c.records.unshift(r); renderDetail(c);
}

function updateRec(rid, field, val) {
  var c = clients.filter(function(x) { return x.id === currentId; })[0]; if (!c) return;
  var r = c.records.filter(function(r) { return r.id === rid; })[0]; if (r) r[field] = val;
}

function deleteRec(rid) {
  var c = clients.filter(function(x) { return x.id === currentId; })[0]; if (!c) return;
  c.records = c.records.filter(function(r) { return r.id !== rid; }); renderDetail(c);
}

function saveClient() {
  var c = clients.filter(function(x) { return x.id === currentId; })[0]; if (!c) return;
  c.name = document.getElementById('edit-name').value;
  c.birthday = document.getElementById('edit-bday').value;
  var codeEl = document.getElementById('edit-code'); if (codeEl) c.code = codeEl.value;
  scheduleSync(); showToast('儲存中…', 'ok');
}

function deleteClient() {
  var c = clients.filter(function(x) { return x.id === currentId; })[0];
  if (!c) return;
  if (!confirm('⚠️ 確定要刪除「' + c.name + '」嗎？\n\n刪除後資料將無法復原！')) return;
  if (!confirm('再次確認：真的要永久刪除「' + c.name + '」的所有資料嗎？')) return;
  clients = clients.filter(function(x) { return x.id !== currentId; });
  closeDetail(); scheduleSync(); showToast('已刪除 ' + c.name);
}

// ── Edit note inline
function editNote(btn) {
  var wrap = btn.parentElement;
  var fullDiv = wrap.querySelector('.note-full');
  var textarea = wrap.querySelector('.note-empty');
  var text = fullDiv ? fullDiv.textContent : '';
  if (textarea) {
    textarea.value = text;
    textarea.style.display = 'block';
    textarea.style.minHeight = '100px';
    textarea.focus();
  }
  if (fullDiv) fullDiv.style.display = 'none';
  btn.style.display = 'none';
}

// ── Note modal ─────────────────────────────────────────────────
function openNoteModal(note) {
  document.getElementById('noteModalBody').textContent = note;
  document.getElementById('noteModal').classList.add('open');
}
document.getElementById('noteModal').addEventListener('click', function(e) { if (e.target === this) closeModal('noteModal'); });

// ── New client ─────────────────────────────────────────────────
function openNewModal() {
  document.getElementById('newModal').classList.add('open');
  document.getElementById('newName').value = '';
  document.getElementById('newBday').value = '';
  setTimeout(function() { document.getElementById('newName').focus(); }, 150);
}
document.getElementById('newModal').addEventListener('click', function(e) { if (e.target === this) closeModal('newModal'); });

function createClient() {
  var name = document.getElementById('newName').value.trim();
  if (!name) { alert('請輸入姓名'); return; }
  var dup = clients.filter(function(c) { return c.name === name; });
  if (dup.length > 0) {
    var go = confirm('⚠️ 已有客戶叫「' + name + '」\n\n確定要新增第二筆嗎？\n（如不是重複請按確定）');
    if (!go) return;
  }
  var c = { id: Date.now().toString(), name: name, birthday: document.getElementById('newBday').value, tags: [], records: [], createdAt: new Date().toISOString(), code: '' };
  clients.unshift(c); closeModal('newModal'); renderList(); renderBdayBanner(); openDetail(c.id); scheduleSync();
}

// ── Tag modal ──────────────────────────────────────────────────
function openTagModal() {
  document.getElementById('tagModal').classList.add('open');
  document.getElementById('tagName').value = '';
  newTagColor = TAG_COLORS[0];
  document.getElementById('colorRow').innerHTML = TAG_COLORS.map(function(c) {
    return '<div class="cdot' + (c === newTagColor ? ' on' : '') + '" style="background:' + c + '" onclick="pickColor(\'' + c + '\',this)"></div>';
  }).join('');
}
document.getElementById('tagModal').addEventListener('click', function(e) { if (e.target === this) closeModal('tagModal'); });

function pickColor(c, el) {
  newTagColor = c;
  document.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('on'); });
  el.classList.add('on');
}

function confirmAddTag() {
  var name = document.getElementById('tagName').value.trim();
  if (!name) { alert('請輸入標籤名稱'); return; }
  tags.push({ id: 'tag_' + Date.now(), name: name, color: newTagColor });
  closeModal('tagModal'); renderChips();
  var c = clients.filter(function(x) { return x.id === currentId; })[0];
  if (c) renderDetail(c);
  scheduleSync(); showToast('標籤已新增', 'ok');
}

// Wait for GSI to load then auto login - with 8 second timeout
var gsiWaitCount = 0;
function waitForGSI() {
  gsiWaitCount++;
  if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
    tryAutoLogin();
  } else if (gsiWaitCount > 40) {
    // Timeout after 8 seconds - show login screen anyway
    showScreen('login');
  } else {
    setTimeout(waitForGSI, 200);
  }
}
waitForGSI();
</script>
