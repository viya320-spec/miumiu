<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Miu客戶關懷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --mint:#34c79a;--mint-light:#f0faf6;--mint-mid:#a8e6d0;--mint-dark:#1a9e75;
  --bg:#f2f2f7;--card:#ffffff;
  --text1:#1c1c1e;--text2:#6c6c70;--text3:#aeaeb2;
  --border:#e5e5ea;--sep:#d1d1d6;
  --red:#ff3b30;--blue:#007aff;
  --r-sm:10px;--r-md:13px;--r-lg:16px;--r-xl:20px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text1);font-size:16px;line-height:1.5;}

/* ── Login ── */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;gap:20px;background:#fff;}
.login-icon{width:72px;height:72px;border-radius:22px;background:var(--mint-light);display:flex;align-items:center;justify-content:center;font-size:36px;}
.login-title{font-size:22px;font-weight:700;color:var(--text1);}
.login-sub{font-size:14px;color:var(--text2);text-align:center;line-height:1.6;}
.btn-google{display:flex;align-items:center;gap:10px;padding:14px 20px;font-size:16px;font-weight:600;border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;color:var(--text1);cursor:pointer;width:100%;justify-content:center;}
.btn-google svg{width:20px;height:20px;flex-shrink:0;}

/* ── App ── */
.app{background:var(--bg);min-height:100vh;padding-bottom:80px;}

/* ── Nav bar ── */
.navbar{background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:0.5px solid var(--sep);padding:12px 16px 10px;position:sticky;top:0;z-index:10;}
.navbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.nav-title{font-size:17px;font-weight:700;color:var(--text1);}
.nav-right{display:flex;align-items:center;gap:8px;}
.btn-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--mint-light);border:none;cursor:pointer;color:var(--mint-dark);font-size:18px;}
.btn-new-nav{display:flex;align-items:center;gap:4px;padding:7px 14px;font-size:14px;font-weight:600;border:none;border-radius:20px;background:var(--mint);color:#fff;cursor:pointer;}
.search-wrap{position:relative;}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text3);}
.search-wrap input{width:100%;padding:9px 10px 9px 32px;font-size:15px;border:none;border-radius:var(--r-md);background:var(--bg);color:var(--text1);}
.search-wrap input:focus{outline:none;}

/* ── Status bar ── */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:var(--mint-light);}
.status-user{font-size:12px;color:var(--mint-dark);font-weight:500;display:flex;align-items:center;gap:4px;overflow:hidden;}
.status-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;}
.status-right{display:flex;align-items:center;gap:8px;}
.sync-badge{font-size:12px;color:var(--mint-dark);display:flex;align-items:center;gap:3px;font-weight:500;}
.sync-badge.syncing{color:#ff9500;}
.sync-badge.err{color:var(--red);}
.btn-logout-sm{font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;padding:2px 6px;}

/* ── Filter chips ── */
.chips{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:0.5px solid var(--sep);}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.chip.active{background:var(--mint);color:#fff;border-color:var(--mint);font-weight:600;}

/* ── Client list ── */
.list{padding:0 16px;margin-top:12px;display:flex;flex-direction:column;gap:1px;}
.section-header{font-size:13px;font-weight:600;color:var(--text2);padding:8px 4px 4px;letter-spacing:.3px;}
.client-card{background:#fff;border-radius:var(--r-lg);margin-bottom:8px;overflow:hidden;cursor:pointer;}
.client-card:active{opacity:.7;}
.card-inner{display:flex;align-items:center;gap:12px;padding:13px 14px;}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;background:var(--mint-light);color:var(--mint-dark);}
.card-content{flex:1;min-width:0;}
.card-name{font-size:16px;font-weight:600;color:var(--text1);margin-bottom:2px;}
.card-meta{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.card-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.card-arrow{color:var(--text3);font-size:16px;flex-shrink:0;}
.card-record{font-size:12px;color:var(--text3);padding:0 14px 10px 70px;margin-top:-4px;}
.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty i{font-size:48px;display:block;margin-bottom:12px;color:var(--mint-mid);}
.empty-title{font-size:17px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.empty-sub{font-size:14px;}

/* ── Panel ── */
.panel{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:80px;}
.panel.open{transform:translateX(0);}
.panel-nav{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid var(--sep);position:sticky;top:0;z-index:5;}
.btn-back-text{display:flex;align-items:center;gap:2px;font-size:16px;color:var(--mint);background:none;border:none;cursor:pointer;font-weight:400;padding:0;}
.panel-nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--text1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-done{font-size:16px;font-weight:600;color:var(--mint);background:none;border:none;cursor:pointer;padding:0;}

/* ── Form groups ── */
.form-section{background:#fff;border-radius:var(--r-xl);margin:12px 16px 0;overflow:hidden;}
.form-section-title{font-size:13px;font-weight:600;color:var(--text2);padding:14px 16px 6px;letter-spacing:.3px;}
.form-row{display:flex;align-items:center;padding:0 16px;border-bottom:0.5px solid var(--sep);min-height:48px;}
.form-row:last-child{border-bottom:none;}
.form-label{font-size:15px;color:var(--text1);width:80px;flex-shrink:0;font-weight:500;}
.form-input{flex:1;padding:12px 0;font-size:15px;border:none;background:transparent;color:var(--text1);outline:none;text-align:right;}
.form-input::placeholder{color:var(--text3);}
.form-textarea{flex:1;padding:12px 0;font-size:15px;border:none;background:transparent;color:var(--text1);outline:none;resize:none;line-height:1.5;text-align:right;}
.form-textarea::placeholder{color:var(--text3);}

/* ── Tags section ── */
.tags-wrap{padding:10px 16px 14px;display:flex;flex-wrap:wrap;gap:8px;}
.tag-chip{padding:6px 14px;border-radius:20px;font-size:14px;font-weight:500;border:1.5px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;}
.tag-chip.selected{font-weight:600;}
.tag-chip .tag-del{font-size:14px;color:var(--text3);margin-left:2px;}
.btn-add-tag{padding:6px 14px;border-radius:20px;font-size:14px;border:1.5px dashed var(--sep);background:#fff;color:var(--mint);cursor:pointer;display:flex;align-items:center;gap:4px;font-weight:500;}

/* ── Records ── */
.records-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;}
.records-title{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.3px;}
.btn-add-rec{font-size:14px;font-weight:600;color:var(--mint);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:3px;}
.record-card{background:#fff;border-radius:var(--r-lg);margin:0 16px 10px;overflow:hidden;}
.rec-date-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--sep);}
.rec-date-input{font-size:15px;border:none;background:transparent;color:var(--mint-dark);font-weight:600;outline:none;}
.rec-del-btn{background:none;border:none;color:var(--red);font-size:20px;cursor:pointer;padding:0;}
.rec-field{padding:0 14px;border-bottom:0.5px solid var(--sep);}
.rec-field:last-child{border-bottom:none;}
.rec-field-label{font-size:12px;font-weight:600;color:var(--text3);padding-top:10px;letter-spacing:.3px;}
.rec-field input,.rec-field textarea{width:100%;font-size:15px;border:none;background:transparent;color:var(--text1);outline:none;padding:6px 0 10px;resize:none;line-height:1.5;}
.rec-field input::placeholder,.rec-field textarea::placeholder{color:var(--text3);}
.no-rec{text-align:center;padding:20px;color:var(--text3);font-size:14px;}

/* ── Delete btn ── */
.btn-delete{margin:16px 16px 0;width:calc(100% - 32px);padding:14px;font-size:16px;font-weight:600;color:var(--red);background:#fff;border:none;border-radius:var(--r-lg);cursor:pointer;}

/* ── Modal ── */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:40;display:none;align-items:flex-end;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 44px;width:100%;display:flex;flex-direction:column;gap:14px;}
.modal-title{font-size:17px;font-weight:700;color:var(--text1);}
.modal-input{padding:13px 14px;font-size:16px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);color:var(--text1);width:100%;outline:none;}
.modal-input:focus{border-color:var(--mint);}
.modal-actions{display:flex;gap:10px;}
.btn-modal-cancel{flex:1;padding:14px;font-size:16px;border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;color:var(--text2);cursor:pointer;font-weight:500;}
.btn-modal-ok{flex:1;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:var(--r-lg);background:var(--mint);color:#fff;cursor:pointer;}

/* ── Tag add modal ── */
.color-picker{display:flex;gap:10px;flex-wrap:wrap;}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
.color-dot.chosen{border-color:var(--text1);}

/* ── Toast ── */
.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:30px;font-size:14px;font-weight:500;z-index:60;transition:transform .28s;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--mint-dark);}
.toast.err{background:var(--red);}

.spinning{display:inline-block;animation:spin .8s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Login -->
<div id="loginScreen" class="login">
  <div class="login-icon">🌿</div>
  <div class="login-title">Miu 客戶關懷</div>
  <div class="login-sub">登入 Google 帳號<br>資料自動同步至您的 Google Sheets</div>
  <button class="btn-google" onclick="signIn()">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    使用 Google 帳號登入
  </button>
</div>

<!-- Main -->
<div id="mainApp" style="display:none;">
  <div class="app">
    <div class="navbar">
      <div class="navbar-row">
        <div class="nav-title">Miu 客戶關懷</div>
        <div class="nav-right">
          <button class="btn-new-nav" onclick="openNewModal()"><i class="ti ti-plus"></i> 新增</button>
        </div>
      </div>
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" id="searchInput" placeholder="搜尋客戶姓名…" oninput="renderList()"/>
      </div>
    </div>
    <div class="statusbar">
      <div class="status-user"><i class="ti ti-user-circle" style="font-size:14px;flex-shrink:0"></i><span class="status-email" id="userEmail"></span></div>
      <div class="status-right">
        <span class="sync-badge" id="syncBadge"><i class="ti ti-cloud-check"></i> 已同步</span>
        <button class="btn-logout-sm" onclick="signOut()">登出</button>
      </div>
    </div>
    <div class="chips" id="chipsRow">
      <button class="chip active" id="chip-all" onclick="setFilter('')">全部</button>
    </div>
    <div class="list" id="clientList"></div>
  </div>
</div>

<!-- Detail Panel -->
<div class="panel" id="detailPanel">
  <div class="panel-nav">
    <button class="btn-back-text" onclick="closeDetail()"><i class="ti ti-chevron-left" style="font-size:20px"></i> 返回</button>
    <span class="panel-nav-title" id="panelTitle"></span>
    <button class="btn-done" onclick="saveClient()">儲存</button>
  </div>
  <div id="panelBody"></div>
  <button class="btn-delete" onclick="deleteClient()">刪除客戶</button>
</div>

<!-- New Client Modal -->
<div class="modal-bg" id="newModal">
  <div class="modal">
    <div class="modal-title">新增客戶</div>
    <div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500;">姓名 *</div>
      <input class="modal-input" type="text" id="newName" placeholder="請輸入姓名"/>
    </div>
    <div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500;">生日</div>
      <input class="modal-input" type="date" id="newBday"/>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeNewModal()">取消</button>
      <button class="btn-modal-ok" onclick="createClient()">新增</button>
    </div>
  </div>
</div>

<!-- Add Tag Modal -->
<div class="modal-bg" id="tagModal">
  <div class="modal">
    <div class="modal-title">新增標籤</div>
    <div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500;">標籤名稱</div>
      <input class="modal-input" type="text" id="tagName" placeholder="例：敏感肌、VIP…" maxlength="8"/>
    </div>
    <div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:500;">顏色</div>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeTagModal()">取消</button>
      <button class="btn-modal-ok" onclick="confirmAddTag()">新增</button>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
const CLIENT_ID='543207730758-9ts36ee65ientbnj0oldfp2qk7k1uc0r.apps.googleusercontent.com';
const SHEET_ID='184tkzxwG2jTnf3amFlEtpdjul_LFWreMLIIfBDK1U0E';
const SHEET_TITLE='Miu客戶關懷';
const TAG_SHEET='標籤設定';

// Default tags
const DEFAULT_TAGS=[
  {id:'old',name:'舊客',color:'#34c79a'},
  {id:'lost',name:'未成交',color:'#ff9500'},
  {id:'phone',name:'電話客',color:'#007aff'},
];

const TAG_COLORS=['#34c79a','#007aff','#ff3b30','#ff9500','#af52de','#ff2d55','#5ac8fa','#4cd964'];

let clients=[], customTags=[...DEFAULT_TAGS];
let currentFilter='', currentId=null, accessToken=null;
let syncTimer=null, isSyncing=false;
let newTagColor=TAG_COLORS[0];

// ── Helpers ──────────────────────────────
function showToast(msg,type,dur){
  dur=dur||2000;
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+(type||''); t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},dur);
}
function setSyncBadge(state){
  const el=document.getElementById('syncBadge'); if(!el)return;
  if(state==='syncing'){el.className='sync-badge syncing';el.innerHTML='<span class="spinning"><i class="ti ti-loader" style="font-size:13px"></i></span> 同步中';}
  else if(state==='ok'){el.className='sync-badge';el.innerHTML='<i class="ti ti-cloud-check"></i> 已同步';}
  else{el.className='sync-badge err';el.innerHTML='<i class="ti ti-cloud-off"></i> 失敗';}
}
function tagById(id){ return customTags.find(function(t){return t.id===id;})||{name:id,color:'#aaa'}; }
function scheduleSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(function(){syncAll(true);},1500); }

// ── Auth ─────────────────────────────────
function signIn(){
  google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file email profile',
    callback:async function(resp){
      if(resp.error){showToast('登入失敗','err');return;}
      accessToken=resp.access_token;
      const info=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+accessToken}}).then(function(r){return r.json();});
      document.getElementById('userEmail').textContent=info.email||'';
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('mainApp').style.display='block';
      await loadTags();
      await loadClients();
      renderChips();
      renderList();
    }
  }).requestAccessToken();
}
function signOut(){
  if(accessToken)google.accounts.oauth2.revoke(accessToken,function(){});
  accessToken=null;
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('mainApp').style.display='none';
}

// ── Sheets ───────────────────────────────
async function sheetsReq(path,method,body){
  method=method||'GET';
  const opts={method:method,headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  return fetch('https://sheets.googleapis.com/v4/spreadsheets'+path,opts).then(function(r){return r.json();});
}

async function loadClients(){
  setSyncBadge('syncing');
  try{
    const res=await sheetsReq('/'+SHEET_ID+'/values/'+encodeURIComponent(SHEET_TITLE+'!A2:F'));
    const rows=res.values||[];
    clients=rows.map(function(r){return{
      id:r[0]||'',name:r[1]||'',birthday:r[2]||'',
      tags:r[3]?r[3].split(',').filter(Boolean):[],
      records:r[4]?(function(){try{return JSON.parse(r[4]);}catch(e){return[];}})():[],
      createdAt:r[5]||''
    };}).filter(function(c){return c.id;});
    setSyncBadge('ok');
  }catch(e){setSyncBadge('err');}
}

async function loadTags(){
  try{
    const res=await sheetsReq('/'+SHEET_ID+'/values/'+encodeURIComponent(TAG_SHEET+'!A2:C'));
    const rows=res.values||[];
    if(rows.length){
      customTags=rows.map(function(r){return{id:r[0]||'',name:r[1]||'',color:r[2]||'#34c79a'};}).filter(function(t){return t.id;});
    }
  }catch(e){}
}

async function syncAll(silent){
  if(!accessToken||isSyncing)return;
  isSyncing=true; setSyncBadge('syncing');
  try{
    // Sync clients
    const cvals=[['ID','姓名','生日','標籤','紀錄JSON','建立時間']].concat(
      clients.map(function(c){return[c.id,c.name,c.birthday||'',c.tags.join(','),JSON.stringify(c.records||[]),c.createdAt||''];})
    );
    await sheetsReq('/'+SHEET_ID+'/values/'+encodeURIComponent(SHEET_TITLE+'!A1')+'?valueInputOption=RAW','PUT',{values:cvals});
    // Sync tags
    const tvals=[['ID','名稱','顏色']].concat(customTags.map(function(t){return[t.id,t.name,t.color];}));
    await sheetsReq('/'+SHEET_ID+'/values/'+encodeURIComponent(TAG_SHEET+'!A1')+'?valueInputOption=RAW','PUT',{values:tvals});
    setSyncBadge('ok');
    if(!silent)showToast('已同步','ok');
  }catch(e){setSyncBadge('err');showToast('同步失敗','err');}
  isSyncing=false;
}

// ── Render chips ──────────────────────────
function renderChips(){
  const row=document.getElementById('chipsRow');
  row.innerHTML='<button class="chip'+(currentFilter===''?' active':'')+'" onclick="setFilter(\'\')">全部</button>';
  customTags.forEach(function(t){
    const btn=document.createElement('button');
    btn.className='chip'+(currentFilter===t.id?' active':'');
    btn.textContent=t.name;
    if(currentFilter===t.id){btn.style.background=t.color;btn.style.borderColor=t.color;}
    btn.onclick=function(){setFilter(t.id);};
    row.appendChild(btn);
  });
}

function setFilter(f){
  currentFilter=f; renderChips(); renderList();
}

// ── Render list ───────────────────────────
function initials(n){return n?n.slice(0,2):'??';}

function renderList(){
  const q=document.getElementById('searchInput').value.trim();
  const list=clients.filter(function(c){
    if(q&&!c.name.includes(q))return false;
    if(currentFilter&&!c.tags.includes(currentFilter))return false;
    return true;
  });
  const el=document.getElementById('clientList');
  if(!list.length){
    el.innerHTML='<div class="empty"><i class="ti ti-users"></i><div class="empty-title">尚無客戶</div><div class="empty-sub">點右上角新增第一位客戶</div></div>';
    return;
  }
  el.innerHTML=list.map(function(c){
    const sorted=(c.records||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
    const last=sorted[0]||null;
    const tagHtml=c.tags.map(function(tid){
      const t=tagById(tid);
      return '<span class="card-tag" style="background:'+t.color+'22;color:'+t.color+';">'+t.name+'</span>';
    }).join('');
    return '<div class="client-card" onclick="openDetail(\''+c.id+'\')">'+
      '<div class="card-inner">'+
      '<div class="avatar" style="background:'+( c.tags[0]?tagById(c.tags[0]).color+'22':'var(--mint-light)')+'color:'+( c.tags[0]?tagById(c.tags[0]).color:'var(--mint-dark)')+'">'+initials(c.name)+'</div>'+
      '<div class="card-content">'+
      '<div class="card-name">'+c.name+'</div>'+
      '<div class="card-meta">'+
      (c.birthday?'<span>'+c.birthday+'</span>':'')+
      tagHtml+
      '</div></div>'+
      '<i class="ti ti-chevron-right card-arrow"></i>'+
      '</div>'+
      (last?'<div class="card-record"><i class="ti ti-calendar-event" style="font-size:12px;vertical-align:-1px"></i> '+last.date+(last.procedure?'・'+last.procedure:'')+'</div>':'')+
      '</div>';
  }).join('');
}

// ── Detail ────────────────────────────────
function openDetail(id){
  currentId=id;
  const c=clients.find(function(x){return x.id===id;});
  document.getElementById('panelTitle').textContent=c.name;
  renderDetail(c);
  document.getElementById('detailPanel').classList.add('open');
  window.scrollTo(0,0);
}
function closeDetail(){
  document.getElementById('detailPanel').classList.remove('open');
  currentId=null; renderList();
}

function renderDetail(c){
  const sorted=(c.records||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});

  const tagChips=customTags.map(function(t){
    const on=c.tags.includes(t.id);
    return '<button class="tag-chip'+(on?' selected':'')+'" style="'+(on?'background:'+t.color+'22;border-color:'+t.color+';color:'+t.color+';':'')+'" onclick="toggleTag(\''+t.id+'\',this,\''+t.color+'\')">'+t.name+'</button>';
  }).join('');

  const recsHtml=sorted.map(function(r){
    return '<div class="record-card">'+
      '<div class="rec-date-row">'+
      '<input type="date" class="rec-date-input" value="'+r.date+'" onchange="updateRec(\''+r.id+'\',\'date\',this.value)"/>'+
      '<button class="rec-del-btn" onclick="deleteRec(\''+r.id+'\')"><i class="ti ti-x"></i></button>'+
      '</div>'+
      '<div class="rec-field"><div class="rec-field-label">療程項目</div>'+
      '<input type="text" value="'+(r.procedure||'')+'" placeholder="水光、電波、玻尿酸…" onchange="updateRec(\''+r.id+'\',\'procedure\',this.value)"/></div>'+
      '<div class="rec-field"><div class="rec-field-label">小叮嚀</div>'+
      '<textarea rows="2" placeholder="術前術後注意事項…" onchange="updateRec(\''+r.id+'\',\'reminder\',this.value)">'+(r.reminder||'')+'</textarea></div>'+
      '<div class="rec-field"><div class="rec-field-label">小筆記</div>'+
      '<textarea rows="2" placeholder="私人備註…" onchange="updateRec(\''+r.id+'\',\'note\',this.value)">'+(r.note||'')+'</textarea></div>'+
      '</div>';
  }).join('');

  document.getElementById('panelBody').innerHTML=
    '<div class="form-section" style="margin-top:16px;">'+
    '<div class="form-section-title">基本資料</div>'+
    '<div class="form-row"><span class="form-label">姓名</span><input class="form-input" type="text" id="edit-name" value="'+c.name+'" oninput="liveUpdate(\'name\',this.value)" placeholder="請輸入姓名"/></div>'+
    '<div class="form-row"><span class="form-label">生日</span><input class="form-input" type="date" id="edit-bday" value="'+(c.birthday||'')+'" onchange="liveUpdate(\'birthday\',this.value)"/></div>'+
    '</div>'+
    '<div class="form-section" style="margin-top:12px;">'+
    '<div class="form-section-title">標籤</div>'+
    '<div class="tags-wrap" id="detailTags">'+tagChips+
    '<button class="btn-add-tag" onclick="openTagModal()"><i class="ti ti-plus" style="font-size:13px"></i> 新增標籤</button>'+
    '</div></div>'+
    '<div class="records-header"><span class="records-title">預約紀錄</span>'+
    '<button class="btn-add-rec" onclick="addRecord()"><i class="ti ti-plus"></i> 新增</button></div>'+
    (recsHtml||'<div class="no-rec">尚無紀錄，點「新增」開始記錄</div>');
}

function liveUpdate(f,v){
  const c=clients.find(function(x){return x.id===currentId;});
  if(c){c[f]=v;if(f==='name')document.getElementById('panelTitle').textContent=v||'客戶資料';}
}
function toggleTag(k,btn,color){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  if(c.tags.includes(k)){
    c.tags=c.tags.filter(function(t){return t!==k;});
    btn.classList.remove('selected');
    btn.style.background=''; btn.style.borderColor=''; btn.style.color='';
  }else{
    c.tags.push(k);
    btn.classList.add('selected');
    btn.style.background=color+'22'; btn.style.borderColor=color; btn.style.color=color;
  }
}
function addRecord(){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  const r={id:Date.now().toString(),date:new Date().toISOString().slice(0,10),procedure:'',reminder:'',note:''};
  c.records=c.records||[];c.records.unshift(r);renderDetail(c);
}
function updateRec(rid,field,val){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  const r=c.records.find(function(r){return r.id===rid;});if(r)r[field]=val;
}
function deleteRec(rid){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  c.records=c.records.filter(function(r){return r.id!==rid;});renderDetail(c);
}
function saveClient(){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  c.name=document.getElementById('edit-name').value;
  c.birthday=document.getElementById('edit-bday').value;
  scheduleSync(); showToast('儲存中…','ok');
}
function deleteClient(){
  const c=clients.find(function(x){return x.id===currentId;});
  if(!confirm('確定要刪除「'+(c?c.name:'')+'」嗎？'))return;
  clients=clients.filter(function(x){return x.id!==currentId;});
  closeDetail(); scheduleSync();
}

// ── New client ────────────────────────────
function openNewModal(){
  document.getElementById('newModal').classList.add('open');
  document.getElementById('newName').value='';
  document.getElementById('newBday').value='';
  setTimeout(function(){document.getElementById('newName').focus();},150);
}
function closeNewModal(){document.getElementById('newModal').classList.remove('open');}
function createClient(){
  const name=document.getElementById('newName').value.trim();
  if(!name){alert('請輸入姓名');return;}
  const c={id:Date.now().toString(),name:name,birthday:document.getElementById('newBday').value,tags:[],records:[],createdAt:new Date().toISOString()};
  clients.unshift(c); closeNewModal(); renderList(); openDetail(c.id); scheduleSync();
}
document.getElementById('newModal').addEventListener('click',function(e){if(e.target===this)closeNewModal();});

// ── Tag modal ─────────────────────────────
function openTagModal(){
  document.getElementById('tagModal').classList.add('open');
  document.getElementById('tagName').value='';
  newTagColor=TAG_COLORS[0];
  const picker=document.getElementById('colorPicker');
  picker.innerHTML=TAG_COLORS.map(function(c){
    return '<div class="color-dot'+(c===newTagColor?' chosen':'')+'" style="background:'+c+'" onclick="pickColor(\''+c+'\',this)"></div>';
  }).join('');
}
function closeTagModal(){document.getElementById('tagModal').classList.remove('open');}
function pickColor(c,el){
  newTagColor=c;
  document.querySelectorAll('.color-dot').forEach(function(d){d.classList.remove('chosen');});
  el.classList.add('chosen');
}
function confirmAddTag(){
  const name=document.getElementById('tagName').value.trim();
  if(!name){alert('請輸入標籤名稱');return;}
  const id='tag_'+Date.now();
  customTags.push({id:id,name:name,color:newTagColor});
  closeTagModal();
  renderChips();
  // Re-render tags in detail if open
  const c=clients.find(function(x){return x.id===currentId;});
  if(c)renderDetail(c);
  scheduleSync();
  showToast('標籤已新增','ok');
}
document.getElementById('tagModal').addEventListener('click',function(e){if(e.target===this)closeTagModal();});
</script>
</body>
</html>
