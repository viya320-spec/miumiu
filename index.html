<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Miu客戶關懷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --rose:#e8637a;--rose-light:#fdf0f2;--rose-mid:#f4b8c2;--rose-dark:#c04060;
  --sage:#5b8a6f;--sage-light:#eef6f1;--sage-mid:#a8d4bb;
  --cream:#fffbf7;--warm:#fff5ee;
  --text1:#2a1f1f;--text2:#6b4f4f;--text3:#b08080;
  --gold:#c9973a;--gold-light:#fdf5e6;
  --border:#f0ddd8;--card:#ffffff;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);-webkit-tap-highlight-color:transparent;font-size:18px;}

.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;gap:28px;background:linear-gradient(160deg,#fde8ec 0%,#fff5f0 50%,#eef6f1 100%);}
.login-logo{width:100px;height:100px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:0 8px 32px rgba(232,99,122,.18);}
.login-brand{font-size:32px;font-weight:700;color:var(--rose-dark);letter-spacing:1px;}
.login-sub{font-size:18px;color:var(--text2);text-align:center;line-height:1.8;}
.btn-google{display:flex;align-items:center;gap:14px;padding:20px 28px;font-size:19px;font-weight:600;border:2px solid #e8ddd8;border-radius:18px;background:#fff;color:var(--text1);cursor:pointer;width:100%;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.06);}
.btn-google svg{width:28px;height:28px;flex-shrink:0;}

.app{background:var(--cream);min-height:100vh;padding-bottom:90px;}
.header{background:#fff;border-bottom:2px solid var(--border);padding:20px 18px 16px;position:sticky;top:0;z-index:10;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{font-size:26px;font-weight:700;color:var(--rose-dark);display:flex;align-items:center;gap:8px;}
.brand i{font-size:28px;}
.btn-new{display:flex;align-items:center;gap:6px;padding:13px 20px;font-size:18px;font-weight:700;border:none;border-radius:16px;background:var(--rose);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(232,99,122,.3);}
.search-box{position:relative;}
.search-box i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--text3);}
.search-box input{width:100%;padding:14px 14px 14px 46px;font-size:19px;border:2px solid var(--border);border-radius:16px;background:var(--warm);color:var(--text1);}
.search-box input:focus{outline:none;border-color:var(--rose-mid);background:#fff;}

.user-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--sage-light);border-bottom:1px solid var(--sage-mid);}
.user-info{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--sage);font-weight:600;}
.sync-status{font-size:14px;color:var(--sage);display:flex;align-items:center;gap:5px;}
.sync-status.syncing{color:var(--gold);}
.sync-status.error{color:#cc3333;}
.btn-logout{padding:8px 14px;font-size:14px;border:1.5px solid var(--sage-mid);border-radius:10px;background:#fff;color:var(--sage);cursor:pointer;font-weight:600;}

.filters{display:flex;gap:10px;padding:14px 18px;overflow-x:auto;background:#fff;border-bottom:2px solid var(--border);}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{padding:12px 22px;border-radius:30px;font-size:17px;border:2px solid var(--border);background:var(--warm);color:var(--text2);cursor:pointer;white-space:nowrap;font-weight:600;}
.filter-btn.active{background:var(--rose);color:#fff;border-color:var(--rose);}
.filter-btn.f-old.active{background:#3b5fa0;border-color:#3b5fa0;color:#fff;}
.filter-btn.f-lost.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.filter-btn.f-phone.active{background:var(--sage);border-color:var(--sage);color:#fff;}

.client-list{padding:16px;display:flex;flex-direction:column;gap:12px;}
.client-card{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:18px 20px;cursor:pointer;position:relative;overflow:hidden;}
.client-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rose-mid);}
.client-card.tag-old::before{background:#7da8e8;}
.client-card.tag-lost::before{background:var(--gold);}
.client-card.tag-phone::before{background:var(--sage-mid);}
.client-card:active{transform:scale(0.97);}
.card-main{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.avatar{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0;background:var(--rose-light);color:var(--rose-dark);border:2px solid var(--rose-mid);}
.avatar.tag-old{background:#e8f0fd;color:#3b5fa0;border-color:#7da8e8;}
.avatar.tag-lost{background:var(--gold-light);color:var(--gold);border-color:#e8c87a;}
.avatar.tag-phone{background:var(--sage-light);color:var(--sage);border-color:var(--sage-mid);}
.client-name{font-size:24px;font-weight:700;color:var(--text1);}
.client-bday{font-size:16px;color:var(--text3);margin-top:3px;}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.tag{font-size:15px;padding:5px 14px;border-radius:20px;font-weight:700;}
.tag.old{background:#e8f0fd;color:#3b5fa0;}
.tag.lost{background:var(--gold-light);color:#8a6010;}
.tag.phone{background:var(--sage-light);color:var(--sage);}
.last-record{font-size:16px;color:var(--text3);display:flex;align-items:center;gap:6px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-icon{font-size:64px;display:block;margin-bottom:14px;color:var(--rose-mid);}
.empty-text{font-size:20px;margin-bottom:8px;color:var(--text2);font-weight:600;}
.empty-sub{font-size:16px;}

.panel{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--cream);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.panel.open{transform:translateX(0);}
.panel-header{display:flex;align-items:center;gap:12px;padding:18px;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:5;}
.btn-back{display:flex;align-items:center;padding:10px;border:2px solid var(--border);background:var(--warm);border-radius:14px;cursor:pointer;color:var(--text1);font-size:28px;}
.panel-name{font-size:24px;font-weight:700;color:var(--text1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-save-top{display:flex;align-items:center;gap:6px;padding:12px 18px;font-size:17px;font-weight:700;border:none;border-radius:14px;background:var(--rose);color:#fff;cursor:pointer;}

.panel-body{padding:18px;display:flex;flex-direction:column;gap:22px;}
.section-card{background:#fff;border:2px solid var(--border);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;}
.section-label{font-size:15px;font-weight:700;color:var(--text3);letter-spacing:1px;}
.field-label{font-size:17px;color:var(--text2);font-weight:600;margin-bottom:7px;}
.field-input{padding:16px;font-size:20px;border:2px solid var(--border);border-radius:14px;background:var(--warm);color:var(--text1);width:100%;-webkit-appearance:none;}
.field-input:focus{outline:none;border-color:var(--rose-mid);background:#fff;}
.tag-select{display:flex;gap:10px;flex-wrap:wrap;}
.tag-toggle{padding:13px 24px;border-radius:30px;font-size:18px;border:2px solid var(--border);background:var(--warm);color:var(--text2);cursor:pointer;font-weight:600;}
.tag-toggle.old.on{background:#e8f0fd;color:#3b5fa0;border-color:#7da8e8;font-weight:700;}
.tag-toggle.lost.on{background:var(--gold-light);color:#8a6010;border-color:#e8c87a;font-weight:700;}
.tag-toggle.phone.on{background:var(--sage-light);color:var(--sage);border-color:var(--sage-mid);font-weight:700;}
.records-header{display:flex;align-items:center;justify-content:space-between;}
.records-title{font-size:20px;font-weight:700;color:var(--text1);}
.btn-add-rec{display:flex;align-items:center;gap:6px;font-size:17px;padding:11px 18px;border:2px solid var(--rose-mid);border-radius:14px;background:var(--rose-light);color:var(--rose-dark);cursor:pointer;font-weight:700;}
.record-item{background:var(--warm);border:2px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.rec-date-row{display:flex;align-items:center;gap:10px;}
.rec-date-input{flex:1;padding:12px 14px;font-size:19px;border:2px solid var(--border);border-radius:12px;background:#fff;color:var(--text1);-webkit-appearance:none;}
.rec-delete{border:none;background:none;color:#e05070;font-size:28px;cursor:pointer;padding:6px 8px;}
.textarea-field{padding:14px;font-size:18px;border:2px solid var(--border);border-radius:14px;background:#fff;color:var(--text1);width:100%;resize:none;line-height:1.6;-webkit-appearance:none;}
.textarea-field:focus{outline:none;border-color:var(--rose-mid);}
.no-records{text-align:center;padding:20px;color:var(--text3);font-size:17px;}
.btn-delete-client{margin:0 18px 20px;padding:18px;font-size:19px;border:2px solid #ffb3b3;border-radius:18px;background:#fff5f5;color:#cc3333;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 36px);font-weight:600;}

.modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(42,10,10,.45);z-index:30;display:none;align-items:flex-end;}
.modal-backdrop.open{display:flex;}
.modal{background:#fff;border-radius:28px 28px 0 0;padding:28px 20px 52px;width:100%;display:flex;flex-direction:column;gap:18px;}
.modal-title{font-size:22px;font-weight:700;color:var(--text1);}
.modal-actions{display:flex;gap:12px;margin-top:6px;}
.btn-cancel{flex:1;padding:18px;font-size:19px;border:2px solid var(--border);border-radius:16px;background:var(--warm);color:var(--text2);cursor:pointer;font-weight:600;}
.btn-confirm{flex:1;padding:18px;font-size:19px;font-weight:700;border:none;border-radius:16px;background:var(--rose);color:#fff;cursor:pointer;}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text1);color:#fff;padding:16px 30px;border-radius:30px;font-size:17px;font-weight:600;z-index:50;transition:transform .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--sage);}
.toast.err{background:#cc3333;}

.spinning{display:inline-block;animation:spin .8s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div id="loginScreen" class="login-screen">
  <div class="login-logo">🌸</div>
  <div class="login-brand">Miu客戶關懷</div>
  <div class="login-sub">請登入您的 Google 帳號<br>資料自動儲存在您的 Google Sheets</div>
  <button class="btn-google" onclick="signIn()">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    使用 Google 帳號登入
  </button>
</div>

<div id="mainApp" style="display:none;">
  <div class="header">
    <div class="header-top">
      <div class="brand"><i class="ti ti-heart"></i> Miu客戶關懷</div>
      <button class="btn-new" onclick="openNewModal()"><i class="ti ti-user-plus"></i> 新增</button>
    </div>
    <div class="search-box">
      <i class="ti ti-search"></i>
      <input type="text" id="searchInput" placeholder="搜尋姓名…" oninput="renderList()"/>
    </div>
  </div>
  <div class="user-bar">
    <div class="user-info"><i class="ti ti-user-circle" style="font-size:18px"></i> <span id="userEmail">載入中…</span></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="sync-status" id="syncStatus"><i class="ti ti-cloud-check"></i> 已同步</span>
      <button class="btn-logout" onclick="signOut()">登出</button>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" id="fb-all" onclick="setFilter('')">全部</button>
    <button class="filter-btn f-old" id="fb-old" onclick="setFilter('old')">舊客</button>
    <button class="filter-btn f-lost" id="fb-lost" onclick="setFilter('lost')">未成交</button>
    <button class="filter-btn f-phone" id="fb-phone" onclick="setFilter('phone')">電話客</button>
  </div>
  <div class="client-list" id="clientList"></div>
</div>

<div class="panel" id="detailPanel">
  <div class="panel-header">
    <button class="btn-back" onclick="closeDetail()"><i class="ti ti-chevron-left"></i></button>
    <span class="panel-name" id="panelTitle">客戶資料</span>
    <button class="btn-save-top" onclick="saveClient()"><i class="ti ti-check"></i> 儲存</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <button class="btn-delete-client" onclick="deleteClient()"><i class="ti ti-trash"></i> 刪除此客戶</button>
</div>

<div class="modal-backdrop" id="newModal">
  <div class="modal">
    <div class="modal-title">🌸 新增客戶</div>
    <div>
      <div class="field-label">姓名 *</div>
      <input class="field-input" type="text" id="newName" placeholder="請輸入姓名"/>
    </div>
    <div>
      <div class="field-label">生日</div>
      <input class="field-input" type="date" id="newBday"/>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeNewModal()">取消</button>
      <button class="btn-confirm" onclick="createClient()">新增</button>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
const CLIENT_ID='543207730758-9ts36ee65ientbnj0oldfp2qk7k1uc0r.apps.googleusercontent.com';
const SHEET_TITLE='Miu客戶關懷';
const TAGS={old:'舊客',lost:'未成交',phone:'電話客'};
const FCLS={old:'f-old',lost:'f-lost',phone:'f-phone'};
let clients=[],currentFilter='',currentId=null,accessToken=null;
let spreadsheetId=localStorage.getItem('miu_sheetId')||null;
let syncTimer=null,isSyncing=false;

function showToast(msg,type,dur){
  dur=dur||2500;
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+(type||'');t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

function setSyncStatus(state){
  const el=document.getElementById('syncStatus');if(!el)return;
  if(state==='syncing'){el.className='sync-status syncing';el.innerHTML='<span class="spinning"><i class="ti ti-loader" style="font-size:16px"></i></span> 同步中…';}
  else if(state==='ok'){el.className='sync-status';el.innerHTML='<i class="ti ti-cloud-check"></i> 已同步';}
  else{el.className='sync-status error';el.innerHTML='<i class="ti ti-cloud-off"></i> 同步失敗';}
}

function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){syncToSheets(true);},2000);
}

function signIn(){
  google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file email profile',
    callback:async function(resp){
      if(resp.error){showToast('登入失敗：'+resp.error,'err');return;}
      accessToken=resp.access_token;
      const info=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+accessToken}}).then(r=>r.json());
      document.getElementById('userEmail').textContent=info.email||'';
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('mainApp').style.display='block';
      await initSheet();await loadFromSheets();renderList();
    }
  }).requestAccessToken();
}

function signOut(){
  if(accessToken)google.accounts.oauth2.revoke(accessToken,function(){});
  accessToken=null;
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('mainApp').style.display='none';
  showToast('已登出');
}

async function sheetsReq(path,method,body){
  method=method||'GET';
  const opts={method:method,headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  return fetch('https://sheets.googleapis.com/v4/spreadsheets'+path,opts).then(r=>r.json());
}

async function initSheet(){
  if(spreadsheetId){
    const chk=await sheetsReq('/'+spreadsheetId+'?fields=spreadsheetId');
    if(chk.spreadsheetId)return;
    spreadsheetId=null;
  }
  const res=await fetch('https://sheets.googleapis.com/v4/spreadsheets',{
    method:'POST',
    headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
    body:JSON.stringify({properties:{title:'Miu客戶關懷系統'},sheets:[{properties:{title:SHEET_TITLE}}]})
  }).then(r=>r.json());
  spreadsheetId=res.spreadsheetId;
  localStorage.setItem('miu_sheetId',spreadsheetId);
  await sheetsReq('/'+spreadsheetId+'/values/'+encodeURIComponent(SHEET_TITLE+'!A1')+'?valueInputOption=RAW','PUT',{values:[['ID','姓名','生日','標籤','紀錄JSON','建立時間']]});
  showToast('✓ 已建立 Google Sheets','ok');
}

async function loadFromSheets(){
  setSyncStatus('syncing');
  const res=await sheetsReq('/'+spreadsheetId+'/values/'+encodeURIComponent(SHEET_TITLE+'!A2:F'));
  const rows=res.values||[];
  clients=rows.map(function(r){return{
    id:r[0]||'',name:r[1]||'',birthday:r[2]||'',
    tags:r[3]?r[3].split(',').filter(Boolean):[],
    records:r[4]?(function(){try{return JSON.parse(r[4]);}catch(e){return[];}})():[],
    createdAt:r[5]||''
  };}).filter(function(c){return c.id;});
  setSyncStatus('ok');
  showToast('✓ 已載入 '+clients.length+' 位客戶','ok');
}

async function syncToSheets(silent){
  if(!accessToken||isSyncing)return;
  isSyncing=true;setSyncStatus('syncing');
  try{
    const values=[['ID','姓名','生日','標籤','紀錄JSON','建立時間']].concat(
      clients.map(function(c){return[c.id,c.name,c.birthday||'',c.tags.join(','),JSON.stringify(c.records||[]),c.createdAt||''];})
    );
    await sheetsReq('/'+spreadsheetId+'/values/'+encodeURIComponent(SHEET_TITLE+'!A1')+'?valueInputOption=RAW','PUT',{values:values});
    setSyncStatus('ok');
    if(!silent)showToast('✓ 已同步到 Google Sheets','ok');
  }catch(e){setSyncStatus('err');showToast('同步失敗，請檢查網路','err');}
  isSyncing=false;
}

function setFilter(f){
  currentFilter=f;
  ['all','old','lost','phone'].forEach(function(k){
    const b=document.getElementById('fb-'+k);
    b.className='filter-btn'+(k!=='all'?' '+FCLS[k]:'');
  });
  document.getElementById('fb-'+(f||'all')).classList.add('active');
  renderList();
}

function initials(n){return n?n.slice(0,2):'??';}
function firstTag(tags){return tags&&tags.length?tags[0]:'';}

function renderList(){
  const q=document.getElementById('searchInput').value.trim();
  const list=clients.filter(function(c){
    if(q&&!c.name.includes(q))return false;
    if(currentFilter&&!c.tags.includes(currentFilter))return false;
    return true;
  });
  const el=document.getElementById('clientList');
  if(!list.length){
    el.innerHTML='<div class="empty-state"><span class="empty-icon"><i class="ti ti-heart-off"></i></span><div class="empty-text">尚無客戶資料</div><div class="empty-sub">按右上角「新增」加入第一位客戶</div></div>';
    return;
  }
  el.innerHTML=list.map(function(c){
    const sorted=(c.records||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
    const last=sorted[0]||null;
    const ft=firstTag(c.tags);
    const tags=c.tags.map(function(t){return'<span class="tag '+t+'">'+TAGS[t]+'</span>';}).join('');
    return '<div class="client-card '+(ft?'tag-'+ft:'')+'" onclick="openDetail(\''+c.id+'\')">'+
      '<div class="card-main">'+
      '<div class="avatar '+(ft?'tag-'+ft:'')+'">'+initials(c.name)+'</div>'+
      '<div><div class="client-name">'+c.name+'</div>'+
      '<div class="client-bday"><i class="ti ti-cake" style="font-size:15px;vertical-align:-2px"></i> '+(c.birthday||'未填生日')+'</div></div>'+
      '</div>'+
      (tags?'<div class="tag-row">'+tags+'</div>':'')+
      '<div class="last-record"><i class="ti ti-calendar-event" style="font-size:16px"></i>'+(last?last.date+'　'+(last.procedure||'無療程項目'):'尚無預約紀錄')+'</div>'+
      '</div>';
  }).join('');
}

function openDetail(id){
  currentId=id;
  const c=clients.find(function(x){return x.id===id;});
  document.getElementById('panelTitle').textContent=c.name;
  renderDetail(c);
  document.getElementById('detailPanel').classList.add('open');
}
function closeDetail(){
  document.getElementById('detailPanel').classList.remove('open');
  currentId=null;renderList();
}

function renderDetail(c){
  const sorted=(c.records||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  const recsHtml=sorted.map(function(r){
    return '<div class="record-item">'+
      '<div class="rec-date-row">'+
      '<i class="ti ti-calendar" style="font-size:22px;color:var(--rose);flex-shrink:0"></i>'+
      '<input type="date" class="rec-date-input" value="'+r.date+'" onchange="updateRec(\''+r.id+'\',\'date\',this.value)"/>'+
      '<button class="rec-delete" onclick="deleteRec(\''+r.id+'\')"><i class="ti ti-x"></i></button>'+
      '</div>'+
      '<div><div class="field-label">療程項目</div>'+
      '<input class="field-input" type="text" value="'+(r.procedure||'')+'" placeholder="例：水光、電波、玻尿酸…" onchange="updateRec(\''+r.id+'\',\'procedure\',this.value)"/></div>'+
      '<div><div class="field-label">🔔 小叮嚀</div>'+
      '<textarea class="textarea-field" rows="3" placeholder="術前術後注意事項…" onchange="updateRec(\''+r.id+'\',\'reminder\',this.value)">'+(r.reminder||'')+'</textarea></div>'+
      '<div><div class="field-label">📝 小筆記</div>'+
      '<textarea class="textarea-field" rows="3" placeholder="私人備註…" onchange="updateRec(\''+r.id+'\',\'note\',this.value)">'+(r.note||'')+'</textarea></div>'+
      '</div>';
  }).join('');

  document.getElementById('panelBody').innerHTML=
    '<div class="section-card">'+
    '<div class="section-label">基本資料</div>'+
    '<div><div class="field-label">姓名</div>'+
    '<input class="field-input" type="text" id="edit-name" value="'+c.name+'" oninput="liveUpdate(\'name\',this.value)"/></div>'+
    '<div><div class="field-label">生日</div>'+
    '<input class="field-input" type="date" id="edit-bday" value="'+(c.birthday||'')+'" onchange="liveUpdate(\'birthday\',this.value)"/></div>'+
    '<div><div class="field-label">標籤</div>'+
    '<div class="tag-select">'+
    Object.entries(TAGS).map(function(e){return'<button class="tag-toggle '+e[0]+' '+(c.tags.includes(e[0])?'on':'')+'" onclick="toggleTag(\''+e[0]+'\',this)">'+e[1]+'</button>';}).join('')+
    '</div></div></div>'+
    '<div class="section-card">'+
    '<div class="records-header">'+
    '<div class="records-title">📋 預約紀錄</div>'+
    '<button class="btn-add-rec" onclick="addRecord()"><i class="ti ti-plus"></i> 新增紀錄</button>'+
    '</div>'+
    '<div id="records-list" style="display:flex;flex-direction:column;gap:14px;">'+
    (recsHtml||'<div class="no-records">尚無預約紀錄<br>按「新增紀錄」開始記錄</div>')+
    '</div></div>';
}

function liveUpdate(f,v){
  const c=clients.find(function(x){return x.id===currentId;});
  if(c){c[f]=v;document.getElementById('panelTitle').textContent=c.name||'客戶資料';}
}
function toggleTag(k,btn){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  if(c.tags.includes(k)){c.tags=c.tags.filter(function(t){return t!==k;});btn.classList.remove('on');}
  else{c.tags.push(k);btn.classList.add('on');}
}
function addRecord(){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  const r={id:Date.now().toString(),date:new Date().toISOString().slice(0,10),procedure:'',reminder:'',note:''};
  c.records=c.records||[];c.records.unshift(r);renderDetail(c);
}
function updateRec(rid,field,val){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  const r=c.records.find(function(r){return r.id===rid;});if(r)r[field]=val;
}
function deleteRec(rid){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  c.records=c.records.filter(function(r){return r.id!==rid;});renderDetail(c);
}
function saveClient(){
  const c=clients.find(function(x){return x.id===currentId;});if(!c)return;
  c.name=document.getElementById('edit-name').value;
  c.birthday=document.getElementById('edit-bday').value;
  scheduleSync();
  showToast('✓ 儲存中，自動同步雲端…','ok');
}
function deleteClient(){
  const c=clients.find(function(x){return x.id===currentId;});
  if(!confirm('確定要刪除「'+(c?c.name:'')+'」嗎？'))return;
  clients=clients.filter(function(x){return x.id!==currentId;});
  closeDetail();scheduleSync();
}
function openNewModal(){
  document.getElementById('newModal').classList.add('open');
  document.getElementById('newName').value='';document.getElementById('newBday').value='';
  setTimeout(function(){document.getElementById('newName').focus();},150);
}
function closeNewModal(){document.getElementById('newModal').classList.remove('open');}
function createClient(){
  const name=document.getElementById('newName').value.trim();
  if(!name){alert('請輸入姓名');return;}
  const c={id:Date.now().toString(),name:name,birthday:document.getElementById('newBday').value,tags:[],records:[],createdAt:new Date().toISOString()};
  clients.unshift(c);closeNewModal();renderList();openDetail(c.id);scheduleSync();
}
document.getElementById('newModal').addEventListener('click',function(e){if(e.target===this)closeNewModal();});
</script>
</body>
</html>
